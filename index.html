<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Império Da Cana - Gestão Comercial</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- FIREBASE SDKs COMPAT v10.12.0 (Sincronizados e Estáveis) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F8FAFC;
      user-select: none;
    }

    .bg-imperio-green { background-color: #024723; }
    .bg-imperio-dark { background-color: #013218; }
    .text-imperio-green { color: #024723; }
    .text-imperio-yellow { color: #EAB308; }
    .bg-imperio-yellow { background-color: #EAB308; }

    .glass-header {
      background: rgba(2, 71, 35, 0.98);
      backdrop-filter: blur(12px);
    }

    .fade-in {
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    iframe[src*="netlify"], [class*="netlify"], #netlify-badge, .netlify-badge {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .pb-safe-nav {
      padding-bottom: 90px !important;
    }

    @media print {
      body * { visibility: hidden; }
      #printable-ticket, #printable-ticket * { visibility: visible; }
      #printable-ticket {
        position: absolute; left: 0; top: 0; width: 100%; max-width: 80mm;
        padding: 5px; font-family: monospace; font-size: 12px; color: #000; background: #fff;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-yellow-400">

  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDl5SWpCEhqpx1j3Fuf93TcLzwqwobQCjE",
      authDomain: "imperiodacana-v2.firebaseapp.com",
      projectId: "imperiodacana-v2",
      storageBucket: "imperiodacana-v2.firebasestorage.app",
      messagingSenderId: "262749512207",
      appId: "1:262749512207:web:07565c3f3d52c4f376797a"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
      db.enableNetwork().catch(() => {});
    } catch (e) {
      console.error("Erro Firebase:", e);
    }

    const { useState, useEffect, useMemo } = React;
    const OFFICIAL_HERO_IMG = "./logo.jpg";

    const INITIAL_CATALOG = [
      { id: 1, name: 'Pastel de Carne', category: 'Pastéis Salgados', price: 12.00, desc: 'Carne moída especial temperada' },
      { id: 2, name: 'Frango c/ Catupiry', category: 'Pastéis Salgados', price: 13.00, desc: 'Frango desfiado com catupiry' },
      { id: 3, name: 'Pastel de Queijo', category: 'Pastéis Salgados', price: 12.00, desc: 'Queijo muçarela derretido' },
      { id: 4, name: 'Pastel de Pizza', category: 'Pastéis Salgados', price: 14.00, desc: 'Queijo, presunto, tomate e orégano' },
      { id: 5, name: 'Costela c/ Queijo', category: 'Pastéis Salgados', price: 17.00, desc: 'Costela desfiada c/ muçarela' },
      { id: 6, name: 'Carne c/ Queijo', category: 'Pastéis Salgados', price: 14.00, desc: 'Carne moída c/ muçarela' },
      
      { id: 7, name: 'Caldo de Cana 500ml', category: 'Caldo de Cana', price: 8.00, desc: 'Cana fresca moída na hora', hasFlavor: true },
      { id: 8, name: 'Garrafa Caldo 500ml', category: 'Caldo de Cana', price: 9.00, desc: 'Garrafa lacrada 500ml', hasFlavor: true },
      { id: 9, name: 'Garrafa Caldo 1Lt', category: 'Caldo de Cana', price: 16.00, desc: 'Garrafa 1 Litro', hasFlavor: true },
      { id: 10, name: 'Garrafa Caldo 2Lt', category: 'Caldo de Cana', price: 23.00, desc: 'Garrafa família 2 Litros', hasFlavor: true },
      { id: 11, name: 'Copo Caldo c/ Abacaxi 500ml', category: 'Caldo de Cana', price: 10.00, desc: 'Com pedaços de abacaxi fresco' },
      
      { id: 12, name: 'Lata Coca-Cola', category: 'Bebidas', price: 5.00, desc: 'Lata 350ml' },
      { id: 13, name: 'Lata Fanta', category: 'Bebidas', price: 5.00, desc: 'Lata 350ml' },
      { id: 14, name: 'Lata Sprite', category: 'Bebidas', price: 5.00, desc: 'Lata 350ml' },
      { id: 15, name: 'Água sem Gás', category: 'Bebidas', price: 2.00, desc: 'Garrafa 500ml' }
    ];

    const FLAVORS = ['Puro', 'Limão', 'Maracujá', 'Caju', 'Abacaxi'];

    const USERS = {
      dev: { username: 'dev', pass: 'dev', role: 'DEV', name: 'Desenvolvedor' },
      admin: { username: 'admin', pass: 'admin', role: 'ADMIN', name: 'Gerente / Dono' },
      atendente: { username: 'atendente', pass: 'atendente123', role: 'ATENDENTE', name: 'Atendente Balcão' }
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('imperio_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [activeTab, setActiveTab] = useState('pdv');
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('imperio_local_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [cart, setCart] = useState([]);
      const [customerName, setCustomerName] = useState('');
      const [orderType, setOrderType] = useState('Balcão');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [isDbConnected, setIsDbConnected] = useState(false);

      const [flavorModalItem, setFlavorModalItem] = useState(null);
      const [selectedFlavor, setSelectedFlavor] = useState('Puro');
      const [printingOrder, setPrintingOrder] = useState(null);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 100);
        return () => clearTimeout(timer);
      }, [activeTab, currentUser, cart, orders]);

      // CONEXÃO EM TEMPO REAL COM O FIRESTORE
      useEffect(() => {
        if (db) {
          const unsubscribe = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(
            snapshot => {
              const fetched = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
              setOrders(fetched);
              setIsDbConnected(true);
            },
            err => {
              console.warn("Aviso Firestore:", err);
              setIsDbConnected(false);
            }
          );
          return () => unsubscribe();
        } else {
          setIsDbConnected(false);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('imperio_local_orders', JSON.stringify(orders));
      }, [orders]);

      const handleLogin = (username, password) => {
        const found = Object.values(USERS).find(u => u.username === username && u.pass === password);
        if (found) {
          setCurrentUser(found);
          localStorage.setItem('imperio_user', JSON.stringify(found));
          setActiveTab(found.role === 'ATENDENTE' ? 'pdv' : 'dashboard');
          return true;
        }
        return false;
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('imperio_user');
      };

      const handleProductClick = (product) => {
        if (product.hasFlavor) {
          setFlavorModalItem(product);
          setSelectedFlavor('Puro');
        } else {
          addItemToCart(product, '');
        }
      };

      const addItemToCart = (product, flavor) => {
        const itemName = flavor && flavor !== 'Puro' ? `${product.name} (${flavor})` : product.name;
        setCart(prev => {
          const existing = prev.find(i => i.id === product.id && i.flavor === flavor);
          if (existing) {
            return prev.map(i => i.id === product.id && i.flavor === flavor ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...product, uniqueKey: `${product.id}-${flavor || 'puro'}`, nameWithFlavor: itemName, flavor, quantity: 1, obs: '' }];
        });
        setFlavorModalItem(null);
      };

      const updateCartQty = (uniqueKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.uniqueKey === uniqueKey) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = useMemo(() => cart.reduce((acc, i) => acc + (i.price * i.quantity), 0), [cart]);

      const handleCreateOrder = async () => {
        if (cart.length === 0) return alert('Adicione pelo menos um item ao pedido!');
        
        const newOrder = {
          id: `CMD-${Math.floor(100 + Math.random() * 900)}`,
          customer: customerName.trim() || 'Cliente Balcão',
          type: orderType,
          status: 'Aguardando',
          paymentStatus: 'Pendente',
          paymentMethod: null,
          createdAt: new Date().toISOString(),
          items: [...cart],
          total: cartTotal
        };

        try {
          if (db && isDbConnected) {
            await db.collection('orders').add(newOrder);
            alert(`Comanda ${newOrder.id} lançada com sucesso no Firebase!`);
          } else {
            setOrders(prev => [newOrder, ...prev]);
            alert(`Comanda ${newOrder.id} salva com sucesso!`);
          }
          setCart([]);
          setCustomerName('');
        } catch (err) {
          setOrders(prev => [newOrder, ...prev]);
          setCart([]);
          setCustomerName('');
          alert(`Comanda ${newOrder.id} salva.`);
        }
      };

      const handlePayOrder = async (orderId, docId, method) => {
        try {
          if (db && docId && isDbConnected) {
            await db.collection('orders').doc(docId).update({
              status: 'Entregue',
              paymentStatus: 'Pago',
              paymentMethod: method,
              closedAt: new Date().toISOString()
            });
          } else {
            setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'Entregue', paymentStatus: 'Pago', paymentMethod: method } : o));
          }
          alert(`Comanda paga via ${method}!`);
        } catch(e) {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'Entregue', paymentStatus: 'Pago', paymentMethod: method } : o));
        }
      };

      const updateOrderStatus = async (docId, orderId, newStatus) => {
        try {
          if (db && docId && isDbConnected) {
            await db.collection('orders').doc(docId).update({ status: newStatus });
          } else {
            setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
          }
        } catch(e) {}
      };

      const handlePrintTicket = (order) => {
        setPrintingOrder(order);
        setTimeout(() => { window.print(); }, 250);
      };

      const cashReport = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const todayOrders = orders.filter(o => o.createdAt && o.createdAt.startsWith(todayStr) && o.paymentStatus === 'Pago');

        let totalRevenue = 0;
        let pastelCount = 0;
        let pastelRevenue = 0;
        let beverageCount = 0;
        let beverageRevenue = 0;
        let payments = { PIX: 0, Dinheiro: 0, Cartão: 0 };

        todayOrders.forEach(o => {
          totalRevenue += o.total || 0;
          if (o.paymentMethod && payments[o.paymentMethod] !== undefined) {
            payments[o.paymentMethod] += o.total || 0;
          }

          if (o.items) {
            o.items.forEach(item => {
              const cat = item.category || '';
              const isPastel = cat.includes('Pastéis');
              const isBeverage = cat.includes('Caldo') || cat.includes('Bebidas');

              if (isPastel) {
                pastelCount += item.quantity || 0;
                pastelRevenue += (item.price || 0) * (item.quantity || 0);
              } else if (isBeverage) {
                beverageCount += item.quantity || 0;
                beverageRevenue += (item.price || 0) * (item.quantity || 0);
              }
            });
          }
        });

        return { totalOrders: todayOrders.length, totalRevenue, pastelCount, pastelRevenue, beverageCount, beverageRevenue, payments };
      }, [orders]);

      if (!currentUser) {
        return <LoginScreen onLogin={handleLogin} />;
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row pb-safe-nav md:pb-0 bg-slate-100">
          
          <header className="glass-header sticky top-0 z-30 text-white px-4 py-3 shadow-md flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Império Da Cana Logo"
                className="w-10 h-10 rounded-xl object-cover border-2 border-yellow-400 shadow-md bg-white"
              />
              <div>
                <h1 className="font-extrabold text-yellow-400 text-sm tracking-wide leading-tight">IMPÉRIO DA CANA</h1>
                <div className="flex items-center gap-1.5">
                  <span className={`w-2 h-2 rounded-full ${isDbConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="text-[10px] text-emerald-200 font-semibold">{isDbConnected ? 'Nuvem Conectada' : 'Modo Offline'}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-xs bg-emerald-900/80 px-2.5 py-1 rounded-full font-bold text-yellow-300 border border-emerald-700 uppercase">
                {currentUser.name.split(' ')[0]}
              </span>
              <button onClick={handleLogout} className="p-2 bg-red-600/80 hover:bg-red-600 rounded-xl text-white transition">
                <i data-lucide="log-out" className="w-4 h-4"></i>
              </button>
            </div>
          </header>

          <aside className="hidden md:flex w-64 h-screen sticky top-0 bg-imperio-green text-white flex-col justify-between shadow-xl flex-shrink-0">
            <div className="p-4 border-b border-emerald-800/80 flex items-center space-x-3">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Logo"
                className="w-12 h-12 rounded-xl object-cover border-2 border-yellow-400 bg-white"
              />
              <div>
                <h2 className="font-black text-yellow-400 text-sm">IMPÉRIO DA CANA</h2>
                <span className="text-[10px] text-emerald-200">Desde 2015</span>
              </div>
            </div>

            <nav className="p-4 space-y-2 flex-1">
              {currentUser.role !== 'ATENDENTE' && (
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'dashboard' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                  <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                  <span>Caixa Diário</span>
                </button>
              )}

              <button onClick={() => setActiveTab('pdv')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'pdv' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                <span>Novo Pedido</span>
              </button>

              <button onClick={() => setActiveTab('comandas')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'comandas' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                <i data-lucide="receipt" className="w-5 h-5"></i>
                <span>Comandas & Receber</span>
              </button>

              <button onClick={() => setActiveTab('kds')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'kds' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                <i data-lucide="utensils" className="w-5 h-5"></i>
                <span>Cozinha</span>
              </button>
            </nav>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 sm:p-6 fade-in">

            {activeTab === 'dashboard' && currentUser.role !== 'ATENDENTE' && (
              <div className="space-y-5">
                <div className="bg-gradient-to-br from-emerald-900 via-imperio-green to-emerald-950 text-white p-6 rounded-3xl shadow-xl border border-emerald-700/50">
                  <div className="flex justify-between items-center pb-4 border-b border-emerald-700/60">
                    <div>
                      <span className="text-[10px] font-black uppercase tracking-wider bg-yellow-400 text-emerald-950 px-3 py-1 rounded-full">
                        Fechamento de Hoje
                      </span>
                      <h2 className="text-2xl font-black text-white mt-2">Balanço de Vendas</h2>
                    </div>
                    <button onClick={() => window.print()} className="p-3 bg-yellow-400 text-emerald-950 rounded-2xl font-extrabold text-xs shadow-lg hover:bg-yellow-300 transition flex items-center gap-1.5">
                      <i data-lucide="printer" className="w-4 h-4"></i> Imprimir
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
                    <div className="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-700/40">
                      <span className="text-xs text-emerald-300 font-semibold block">Total Geral</span>
                      <p className="text-2xl font-black text-yellow-400">R$ {cashReport.totalRevenue.toFixed(2)}</p>
                      <span className="text-[10px] text-emerald-200 mt-1 block">{cashReport.totalOrders} comandas liquidadas</span>
                    </div>

                    <div className="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-700/40">
                      <span className="text-xs text-emerald-300 font-semibold block">Pastéis Vendidos</span>
                      <p className="text-2xl font-black text-white">{cashReport.pastelCount} <span className="text-xs font-normal text-emerald-300">unid.</span></p>
                      <span className="text-xs font-bold text-yellow-400 block mt-1">R$ {cashReport.pastelRevenue.toFixed(2)}</span>
                    </div>

                    <div className="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-700/40">
                      <span className="text-xs text-emerald-300 font-semibold block">Bebidas & Caldo</span>
                      <p className="text-2xl font-black text-white">{cashReport.beverageCount} <span className="text-xs font-normal text-emerald-300">unid.</span></p>
                      <span className="text-xs font-bold text-yellow-400 block mt-1">R$ {cashReport.beverageRevenue.toFixed(2)}</span>
                    </div>
                  </div>

                  <div className="mt-5 pt-4 border-t border-emerald-700/60 grid grid-cols-3 gap-2 text-center">
                    <div className="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-800">
                      <span className="text-[10px] text-emerald-300 font-bold block">PIX</span>
                      <strong className="text-sm text-yellow-400 font-black">R$ {cashReport.payments.PIX.toFixed(2)}</strong>
                    </div>
                    <div className="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-800">
                      <span className="text-[10px] text-emerald-300 font-bold block">DINHEIRO</span>
                      <strong className="text-sm text-yellow-400 font-black">R$ {cashReport.payments.Dinheiro.toFixed(2)}</strong>
                    </div>
                    <div className="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-800">
                      <span className="text-[10px] text-emerald-300 font-bold block">CARTÃO</span>
                      <strong className="text-sm text-yellow-400 font-black">R$ {cashReport.payments.Cartão.toFixed(2)}</strong>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'pdv' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div className="lg:col-span-2 space-y-4">
                  <div className="bg-white p-3.5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                    <div className="relative">
                      <i data-lucide="search" className="w-5 h-5 absolute left-3.5 top-3 text-slate-400"></i>
                      <input
                        type="text"
                        placeholder="Buscar pastel, caldo de cana..."
                        value={searchTerm}
                        onChange={e => setSearchTerm(e.target.value)}
                        className="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-emerald-600 font-medium"
                      />
                    </div>

                    <div className="flex gap-2 overflow-x-auto pb-1">
                      {['Todos', 'Pastéis Salgados', 'Caldo de Cana', 'Bebidas'].map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-4 py-2 rounded-2xl text-xs font-extrabold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-imperio-green text-yellow-400 shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {INITIAL_CATALOG
                      .filter(p => selectedCategory === 'Todos' || p.category === selectedCategory)
                      .filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()))
                      .map(product => (
                        <div
                          key={product.id}
                          onClick={() => handleProductClick(product)}
                          className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 hover:border-emerald-600 transition cursor-pointer flex justify-between items-center group active:scale-95"
                        >
                          <div className="space-y-1">
                            <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-800 bg-emerald-50 px-2.5 py-0.5 rounded-full">
                              {product.category}
                            </span>
                            <h4 className="font-extrabold text-slate-800 text-sm group-hover:text-emerald-900">{product.name}</h4>
                            <p className="text-xs text-slate-500 line-clamp-1">{product.desc}</p>
                            <span className="text-base font-black text-emerald-800 block pt-1">
                              R$ {product.price.toFixed(2)}
                            </span>
                          </div>
                          <button className="w-10 h-10 rounded-2xl bg-yellow-400 text-emerald-950 flex items-center justify-center font-black shadow-md group-hover:bg-emerald-700 group-hover:text-yellow-400 transition">
                            +
                          </button>
                        </div>
                      ))}
                  </div>
                </div>

                <div className="bg-white p-5 rounded-3xl shadow-md border border-slate-200 flex flex-col justify-between h-fit space-y-4">
                  <div>
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-black text-slate-900 text-base flex items-center gap-2">
                        <i data-lucide="shopping-cart" className="w-5 h-5 text-emerald-700"></i>
                        <span>Carrinho Atual</span>
                      </h3>
                      <span className="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                        {cart.length} itens
                      </span>
                    </div>

                    <div className="space-y-3 mt-4">
                      <div>
                        <label className="text-xs font-bold text-slate-600 block mb-1">Nome do Cliente / Comanda</label>
                        <input
                          type="text"
                          placeholder="Ex: João / Mesa 02"
                          value={customerName}
                          onChange={e => setCustomerName(e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-600"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-600 block mb-1">Local / Tipo</label>
                        <select
                          value={orderType}
                          onChange={e => setOrderType(e.target.value)}
                          className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold text-slate-700"
                        >
                          <option value="Balcão">Balcão (Viagem)</option>
                          <option value="Mesa 01">Mesa 01</option>
                          <option value="Mesa 02">Mesa 02</option>
                          <option value="Mesa 03">Mesa 03</option>
                          <option value="Mesa 04">Mesa 04</option>
                        </select>
                      </div>
                    </div>

                    <div className="mt-4 space-y-2.5 max-h-56 overflow-y-auto pr-1">
                      {cart.length === 0 ? (
                        <div className="text-center py-8 text-slate-400 text-xs font-semibold">
                          Selecione os pastéis e caldos do menu ao lado.
                        </div>
                      ) : (
                        cart.map(item => (
                          <div key={item.uniqueKey} className="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs space-y-2">
                            <div className="flex justify-between items-start font-extrabold text-slate-800">
                              <span>{item.nameWithFlavor}</span>
                              <span className="text-emerald-800">R$ {(item.price * item.quantity).toFixed(2)}</span>
                            </div>

                            <div className="flex items-center justify-between pt-1">
                              <div className="flex items-center space-x-2">
                                <button onClick={() => updateCartQty(item.uniqueKey, -1)} className="w-7 h-7 bg-slate-200 text-slate-800 font-black rounded-xl">-</button>
                                <span className="font-extrabold text-sm px-1">{item.quantity}</span>
                                <button onClick={() => updateCartQty(item.uniqueKey, 1)} className="w-7 h-7 bg-slate-200 text-slate-800 font-black rounded-xl">+</button>
                              </div>
                              <span className="text-[10px] text-slate-400 font-semibold">R$ {item.price.toFixed(2)} un.</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <div className="pt-3 border-t space-y-3">
                    <div className="flex justify-between items-center text-lg font-black text-slate-900">
                      <span>Total:</span>
                      <span className="text-xl text-emerald-800">R$ {cartTotal.toFixed(2)}</span>
                    </div>

                    <button
                      onClick={handleCreateOrder}
                      className="w-full py-3.5 bg-imperio-green hover:bg-emerald-900 text-yellow-400 font-black rounded-2xl text-sm shadow-xl transition flex items-center justify-center gap-2 active:scale-98"
                    >
                      <i data-lucide="check-circle" className="w-5 h-5"></i>
                      Lançar Pedido no Banco
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'comandas' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 flex justify-between items-center">
                  <div>
                    <h3 className="font-extrabold text-slate-800 text-sm">Comandas do Dia</h3>
                    <p className="text-xs text-slate-500">Selecione uma comanda aberta para receber o pagamento</p>
                  </div>
                  <span className="text-xs font-black bg-yellow-400 text-emerald-950 px-3 py-1 rounded-full shadow-sm">
                    {orders.filter(o => o.paymentStatus !== 'Pago').length} Abertas
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {orders.length === 0 ? (
                    <div className="col-span-full text-center py-12 text-slate-400 text-sm bg-white rounded-3xl border border-slate-200 font-semibold">
                      Nenhuma comanda lançada no momento.
                    </div>
                  ) : (
                    orders.map(order => (
                      <div key={order.docId || order.id} className={`bg-white rounded-3xl shadow-sm border p-4 flex flex-col justify-between ${order.paymentStatus === 'Pago' ? 'border-emerald-300 bg-emerald-50/20' : 'border-yellow-400'}`}>
                        <div>
                          <div className="flex justify-between items-start font-bold text-xs border-b pb-2">
                            <div>
                              <span className="text-emerald-900 font-black text-sm">{order.id}</span>
                              <span className="block font-bold text-slate-700">{order.customer} ({order.type})</span>
                            </div>
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold ${order.paymentStatus === 'Pago' ? 'bg-emerald-100 text-emerald-800' : 'bg-yellow-100 text-yellow-900'}`}>
                              {order.paymentStatus === 'Pago' ? 'Pago' : 'Em Aberto'}
                            </span>
                          </div>

                          <ul className="text-xs space-y-1.5 my-3">
                            {order.items && order.items.map((it, idx) => (
                              <li key={idx} className="flex justify-between text-slate-700 font-medium">
                                <span>{it.quantity}x {it.nameWithFlavor || it.name}</span>
                                <span className="font-bold">R$ {(it.price * it.quantity).toFixed(2)}</span>
                              </li>
                            ))}
                          </ul>
                        </div>

                        <div className="pt-3 border-t space-y-2">
                          <div className="flex justify-between items-center font-black text-sm text-slate-900">
                            <span>Total Comanda:</span>
                            <span className="text-base text-emerald-800">R$ {order.total ? order.total.toFixed(2) : '0.00'}</span>
                          </div>

                          {order.paymentStatus !== 'Pago' ? (
                            <div className="grid grid-cols-3 gap-1.5 pt-1">
                              <button onClick={() => handlePayOrder(order.id, order.docId, 'PIX')} className="py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-xl text-xs shadow-sm">PIX</button>
                              <button onClick={() => handlePayOrder(order.id, order.docId, 'Dinheiro')} className="py-2.5 bg-yellow-400 hover:bg-yellow-500 text-emerald-950 font-extrabold rounded-xl text-xs shadow-sm">Dinheiro</button>
                              <button onClick={() => handlePayOrder(order.id, order.docId, 'Cartão')} className="py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-xl text-xs shadow-sm">Cartão</button>
                            </div>
                          ) : (
                            <div className="flex justify-between items-center text-xs text-slate-500 pt-1">
                              <span>Pago em <strong>{order.paymentMethod}</strong></span>
                              <button onClick={() => handlePrintTicket(order)} className="px-3 py-1 bg-slate-200 text-slate-800 rounded-lg font-bold">Imprimir</button>
                            </div>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {activeTab === 'kds' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {['Aguardando', 'Em Fritura', 'Pronto'].map(status => {
                  const statusOrders = orders.filter(o => o.status === status);
                  const statusColor = status === 'Aguardando' ? 'border-yellow-500 bg-yellow-50/50' : status === 'Em Fritura' ? 'border-orange-500 bg-orange-50/50' : 'border-emerald-500 bg-emerald-50/50';

                  return (
                    <div key={status} className="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 flex flex-col">
                      <div className={`border-b-2 pb-2 mb-3 flex justify-between items-center ${statusColor}`}>
                        <h3 className="font-extrabold text-slate-800 text-sm">{status}</h3>
                        <span className="text-xs font-black bg-slate-200 px-2.5 py-0.5 rounded-full">{statusOrders.length}</span>
                      </div>

                      <div className="space-y-3 flex-1 overflow-y-auto">
                        {statusOrders.length === 0 ? (
                          <p className="text-center text-slate-400 text-xs py-6 font-semibold">Fila limpa nesta etapa.</p>
                        ) : (
                          statusOrders.map(order => (
                            <div key={order.docId || order.id} className="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                              <div className="flex justify-between items-start font-bold text-xs text-slate-900">
                                <span>{order.id} - {order.customer}</span>
                                <span className="text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full font-extrabold">{order.type}</span>
                              </div>

                              <ul className="text-xs space-y-1 my-2 border-t border-b py-2">
                                {order.items && order.items.map((it, idx) => (
                                  <li key={idx} className="flex flex-col text-slate-800">
                                    <span className="font-bold">{it.quantity}x {it.nameWithFlavor || it.name}</span>
                                  </li>
                                ))}
                              </ul>

                              <div className="pt-1">
                                {status === 'Aguardando' && (
                                  <button onClick={() => updateOrderStatus(order.docId, order.id, 'Em Fritura')} className="w-full py-2 bg-orange-500 text-white font-extrabold rounded-xl text-xs hover:bg-orange-600 shadow-sm">
                                    Iniciar Fritura
                                  </button>
                                )}
                                {status === 'Em Fritura' && (
                                  <button onClick={() => updateOrderStatus(order.docId, order.id, 'Pronto')} className="w-full py-2 bg-emerald-600 text-white font-extrabold rounded-xl text-xs hover:bg-emerald-700 shadow-sm">
                                    Marcar Pronto
                                  </button>
                                )}
                                {status === 'Pronto' && (
                                  <button onClick={() => updateOrderStatus(order.docId, order.id, 'Entregue')} className="w-full py-2 bg-slate-800 text-white font-extrabold rounded-xl text-xs hover:bg-slate-900 shadow-sm">
                                    Entregue
                                  </button>
                                )}
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

          </main>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 glass-header border-t border-emerald-800/80 px-2 py-2 flex justify-around items-center z-40">
            {currentUser.role !== 'ATENDENTE' && (
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${activeTab === 'dashboard' ? 'text-yellow-400 font-bold' : 'text-emerald-200'}`}
              >
                <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                <span className="text-[10px] mt-0.5">Caixa</span>
              </button>
            )}

            <button
              onClick={() => setActiveTab('pdv')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${activeTab === 'pdv' ? 'text-yellow-400 font-bold' : 'text-emerald-200'}`}
            >
              <i data-lucide="shopping-bag" className="w-5 h-5"></i>
              <span className="text-[10px] mt-0.5">Pedido</span>
            </button>

            <button
              onClick={() => setActiveTab('comandas')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${activeTab === 'comandas' ? 'text-yellow-400 font-bold' : 'text-emerald-200'}`}
            >
              <i data-lucide="receipt" className="w-5 h-5"></i>
              <span className="text-[10px] mt-0.5">Comandas</span>
            </button>

            <button
              onClick={() => setActiveTab('kds')}
              className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${activeTab === 'kds' ? 'text-yellow-400 font-bold' : 'text-emerald-200'}`}
            >
              <i data-lucide="utensils" className="w-5 h-5"></i>
              <span className="text-[10px] mt-0.5">Cozinha</span>
            </button>
          </nav>

          {flavorModalItem && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border-2 border-yellow-400 fade-in">
                <h3 className="font-black text-lg text-emerald-950 text-center">Sabor do Caldo de Cana</h3>
                <p className="text-xs text-center text-slate-500 font-medium">{flavorModalItem.name}</p>

                <div className="space-y-2">
                  {FLAVORS.map(flavor => (
                    <button
                      key={flavor}
                      onClick={() => setSelectedFlavor(flavor)}
                      className={`w-full py-3 px-4 rounded-2xl font-bold text-xs transition border flex justify-between items-center ${selectedFlavor === flavor ? 'bg-imperio-green text-yellow-400 border-emerald-800 shadow-md' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'}`}
                    >
                      <span>{flavor}</span>
                      {selectedFlavor === flavor && <i data-lucide="check" className="w-4 h-4"></i>}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button onClick={() => setFlavorModalItem(null)} className="py-3 bg-slate-200 text-slate-800 font-bold rounded-2xl text-xs">Cancelar</button>
                  <button onClick={() => addItemToCart(flavorModalItem, selectedFlavor)} className="py-3 bg-yellow-400 text-emerald-950 font-black rounded-2xl text-xs shadow-md">Confirmar</button>
                </div>
              </div>
            </div>
          )}

          {printingOrder && (
            <div id="printable-ticket">
              <div style={{ textAlign: 'center', marginBottom: '10px' }}>
                <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: 0 }}>IMPÉRIO DA CANA</h2>
                <p style={{ fontSize: '10px', margin: 0 }}>PASTEL E CALDO DE CANA - DESDE 2015</p>
                <p style={{ fontSize: '10px', margin: 0 }}>Tel: (14) 99843-8050</p>
                <hr style={{ borderStyle: 'dashed', margin: '5px 0' }} />
              </div>

              <div>
                <p style={{ margin: '2px 0' }}><strong>COMANDA: {printingOrder.id}</strong></p>
                <p style={{ margin: '2px 0' }}>Cliente: {printingOrder.customer}</p>
                <p style={{ margin: '2px 0' }}>Local: {printingOrder.type}</p>
                <p style={{ margin: '2px 0' }}>Data: {new Date(printingOrder.createdAt).toLocaleString('pt-BR')}</p>
                <hr style={{ borderStyle: 'dashed', margin: '5px 0' }} />
              </div>

              <div style={{ marginBottom: '10px' }}>
                <p style={{ fontWeight: 'bold', margin: '3px 0' }}>ITENS:</p>
                {printingOrder.items && printingOrder.items.map((it, idx) => (
                  <div key={idx} style={{ marginBottom: '4px' }}>
                    <div>{it.quantity}x {it.nameWithFlavor || it.name} - R$ {(it.price * it.quantity).toFixed(2)}</div>
                  </div>
                ))}
              </div>

              <hr style={{ borderStyle: 'dashed', margin: '5px 0' }} />
              <div style={{ textAlign: 'right', fontWeight: 'bold', fontSize: '14px' }}>
                TOTAL: R$ {printingOrder.total ? printingOrder.total.toFixed(2) : '0.00'}
              </div>
            </div>
          )}

        </div>
      );
    }

    function LoginScreen({ onLogin }) {
      const [username, setUsername] = useState('atendente');
      const [password, setPassword] = useState('atendente123');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const success = onLogin(username, password);
        if (!success) setError(true);
      };

      const fillCreds = (user, pass) => {
        setUsername(user);
        setPassword(pass);
        setError(false);
      };

      return (
        <div className="min-h-screen bg-imperio-green flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-sm w-full border-4 border-yellow-400 p-6 space-y-6 fade-in">
            
            <div className="text-center space-y-2">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Império Da Cana Logo"
                className="w-24 h-24 mx-auto rounded-2xl object-cover border-4 border-yellow-400 shadow-xl bg-white"
              />
              <h1 className="text-2xl font-black text-emerald-950 tracking-wide">IMPÉRIO DA CANA</h1>
              <p className="text-xs font-bold text-slate-500">Agudos, SP • Tel: (14) 99843-8050</p>
            </div>

            <div className="space-y-1.5">
              <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Perfis Rápidos:</span>
              <div className="grid grid-cols-3 gap-1.5">
                <button onClick={() => fillCreds('atendente', 'atendente123')} className="py-2 bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-xl font-extrabold text-xs">
                  Atendente
                </button>
                <button onClick={() => fillCreds('admin', 'admin')} className="py-2 bg-yellow-50 border border-yellow-300 text-yellow-900 rounded-xl font-extrabold text-xs">
                  Gerente
                </button>
                <button onClick={() => fillCreds('dev', 'dev')} className="py-2 bg-purple-50 border border-purple-200 text-purple-900 rounded-xl font-extrabold text-xs">
                  Dev
                </button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {error && (
                <div className="p-3 bg-red-100 text-red-700 text-xs rounded-xl font-bold text-center">
                  Usuário ou senha incorretos!
                </div>
              )}

              <div>
                <label className="text-xs font-bold text-slate-700 block mb-1">Usuário</label>
                <input
                  type="text"
                  value={username}
                  onChange={e => setUsername(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-700"
                  required
                />
              </div>

              <div>
                <label className="text-xs font-bold text-slate-700 block mb-1">Senha</label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-700"
                  required
                />
              </div>

              <button
                type="submit"
                className="w-full py-3.5 bg-imperio-green hover:bg-emerald-900 text-yellow-400 font-black rounded-2xl text-sm transition shadow-xl active:scale-98"
              >
                Entrar no Sistema
              </button>
            </form>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
