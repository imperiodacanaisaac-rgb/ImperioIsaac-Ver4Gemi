<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#024723" />
  <title>Império da Cana - Gestão Comercial</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.babeljs.cn/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f1f5f9;
    }

    .bg-imperio-green { background-color: #024723; }
    .text-imperio-green { color: #024723; }
    .glass-header {
      background: rgba(2, 71, 35, 0.98);
      backdrop-filter: blur(12px);
    }

    .fade-in { animation: fadeIn 0.2s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #printable-ticket,
    #printable-report {
      display: none;
    }

    @media print {
      body * { visibility: hidden !important; }

      body.print-ticket #printable-ticket,
      body.print-ticket #printable-ticket * {
        visibility: visible !important;
      }

      body.print-ticket #printable-ticket {
        display: block !important;
        position: absolute;
        inset: 0 auto auto 0;
        width: 80mm;
        padding: 5mm;
        color: #000;
        background: #fff;
        font: 12px monospace;
      }

      body.print-report #printable-report,
      body.print-report #printable-report * {
        visibility: visible !important;
      }

      body.print-report #printable-report {
        display: block !important;
        position: absolute;
        inset: 0;
        width: 100%;
        padding: 15px;
        color: #000;
        background: #fff;
        font-family: Arial, sans-serif;
      }

      @page {
        margin: 8mm;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDl5SWpCEhqpx1j3Fuf93TcLzwqwobQCjE",
      authDomain: "imperiodacana-v2.firebaseapp.com",
      projectId: "imperiodacana-v2",
      storageBucket: "imperiodacana-v2.firebasestorage.app",
      messagingSenderId: "262749512207",
      appId: "1:262749512207:web:07565c3f3d52c4f376797a"
    };

    let db = null;
    let auth = null;
    let firebaseInitError = null;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      db = firebase.firestore();
      auth = firebase.auth();
    } catch (error) {
      firebaseInitError = error;
      console.error("Falha ao inicializar o Firebase:", error);
    }

    const { useEffect, useMemo, useState } = React;

    const OFFICIAL_HERO_IMG = "./logo.jpg";
    const FLAVORS = ["Puro", "Limão", "Maracujá", "Caju", "Abacaxi"];
    const ORDER_STATUSES = ["Aguardando", "Em Fritura", "Pronto", "Entregue"];
    const PAYMENT_METHODS = ["PIX", "Dinheiro", "Cartão"];

    const INITIAL_CATALOG = [
      { id: 1, name: "Pastel de Carne", category: "Pastéis Salgados", price: 12, desc: "Carne moída especial temperada" },
      { id: 2, name: "Frango c/ Catupiry", category: "Pastéis Salgados", price: 13, desc: "Frango desfiado com catupiry" },
      { id: 3, name: "Pastel de Queijo", category: "Pastéis Salgados", price: 12, desc: "Queijo muçarela derretido" },
      { id: 4, name: "Pastel de Pizza", category: "Pastéis Salgados", price: 14, desc: "Queijo, presunto, tomate e orégano" },
      { id: 5, name: "Costela c/ Queijo", category: "Pastéis Salgados", price: 17, desc: "Costela desfiada c/ muçarela" },
      { id: 6, name: "Carne c/ Queijo", category: "Pastéis Salgados", price: 14, desc: "Carne moída c/ muçarela" },
      { id: 7, name: "Caldo de Cana 500ml", category: "Caldo de Cana", price: 8, desc: "Cana fresca moída na hora", hasFlavor: true },
      { id: 8, name: "Garrafa Caldo 500ml", category: "Caldo de Cana", price: 9, desc: "Garrafa lacrada 500ml", hasFlavor: true },
      { id: 9, name: "Garrafa Caldo 1Lt", category: "Caldo de Cana", price: 16, desc: "Garrafa 1 litro", hasFlavor: true },
      { id: 10, name: "Garrafa Caldo 2Lt", category: "Caldo de Cana", price: 23, desc: "Garrafa família 2 litros", hasFlavor: true },
      { id: 11, name: "Copo Caldo c/ Abacaxi 500ml", category: "Caldo de Cana", price: 10, desc: "Com pedaços de abacaxi fresco" },
      { id: 12, name: "Lata Coca-Cola", category: "Bebidas", price: 5, desc: "Lata 350ml" },
      { id: 13, name: "Lata Fanta", category: "Bebidas", price: 5, desc: "Lata 350ml" },
      { id: 14, name: "Lata Sprite", category: "Bebidas", price: 5, desc: "Lata 350ml" },
      { id: 15, name: "Água sem Gás", category: "Bebidas", price: 2, desc: "Garrafa 500ml" }
    ];

    function localDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatCurrency(value) {
      const safeValue = Number.isFinite(Number(value)) ? Number(value) : 0;
      return new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL"
      }).format(safeValue);
    }

    function formatOrderDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? "Data indisponível"
        : date.toLocaleString("pt-BR");
    }

    function getOrderBusinessDate(order) {
      if (typeof order.businessDate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(order.businessDate)) {
        return order.businessDate;
      }

      if (!order.createdAt) return null;

      const date = new Date(order.createdAt);
      return Number.isNaN(date.getTime()) ? null : localDateKey(date);
    }

    function safeItems(items) {
      return Array.isArray(items) ? items : [];
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState("");
      const [activeTab, setActiveTab] = useState("pdv");
      const [orders, setOrders] = useState([]);
      const [ordersLoading, setOrdersLoading] = useState(false);
      const [isDbConnected, setIsDbConnected] = useState(false);

      const [cart, setCart] = useState([]);
      const [customerName, setCustomerName] = useState("");
      const [orderType, setOrderType] = useState("Balcão");
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("Todos");
      const [flavorModalItem, setFlavorModalItem] = useState(null);
      const [selectedFlavor, setSelectedFlavor] = useState("Puro");
      const [printingOrder, setPrintingOrder] = useState(null);
      const [busyOrderIds, setBusyOrderIds] = useState([]);

      useEffect(() => {
        if (!auth) {
          setAuthLoading(false);
          setAuthError("O Firebase não foi inicializado. Verifique a configuração.");
          return undefined;
        }

        return auth.onAuthStateChanged(async firebaseUser => {
          if (!firebaseUser) {
            setCurrentUser(null);
            setAuthLoading(false);
            return;
          }

          try {
            const profileSnapshot = await db.collection("usuarios").doc(firebaseUser.uid).get();

            if (!profileSnapshot.exists) {
              await auth.signOut();
              setAuthError("Perfil de usuário não encontrado no sistema.");
              setCurrentUser(null);
              setAuthLoading(false);
              return;
            }

            const profile = profileSnapshot.data();

            if (profile.ativo !== true || !["ATENDENTE", "GERENTE", "DEV"].includes(profile.role)) {
              await auth.signOut();
              setAuthError("Usuário inativo ou sem perfil autorizado.");
              setCurrentUser(null);
              setAuthLoading(false);
              return;
            }

            setCurrentUser({
              uid: firebaseUser.uid,
              name: typeof profile.name === "string" && profile.name.trim()
                ? profile.name.trim()
                : firebaseUser.email,
              role: profile.role
            });

            setActiveTab(profile.role === "ATENDENTE" ? "pdv" : "dashboard");
            setAuthError("");
            setAuthLoading(false);
          } catch (error) {
            console.error("Falha ao carregar perfil:", error);
            setAuthError("Não foi possível validar o perfil. Tente novamente.");
            setCurrentUser(null);
            setAuthLoading(false);
          }
        });
      }, []);

      useEffect(() => {
        if (!currentUser || !db) {
          setOrders([]);
          setIsDbConnected(false);
          setOrdersLoading(false);
          return undefined;
        }

        setOrdersLoading(true);

        const unsubscribe = db.collection("orders")
          .orderBy("createdAt", "desc")
          .onSnapshot(
            snapshot => {
              setOrders(snapshot.docs.map(document => ({
                ...document.data(),
                docId: document.id
              })));
              setIsDbConnected(true);
              setOrdersLoading(false);
            },
            error => {
              console.error("Erro ao carregar comandas:", error);
              setIsDbConnected(false);
              setOrdersLoading(false);
              window.alert("Não foi possível carregar as comandas do Firestore.");
            }
          );

        return () => unsubscribe();
      }, [currentUser]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, currentUser, cart, orders, flavorModalItem]);

      useEffect(() => {
        const afterPrint = () => {
          document.body.classList.remove("print-ticket", "print-report");
          setPrintingOrder(null);
        };

        window.addEventListener("afterprint", afterPrint);
        return () => window.removeEventListener("afterprint", afterPrint);
      }, []);

      const cartTotal = useMemo(
        () => cart.reduce((total, item) => total + item.price * item.quantity, 0),
        [cart]
      );

      const cashReport = useMemo(() => {
        const today = localDateKey();
        const todayOrders = orders.filter(order =>
          getOrderBusinessDate(order) === today && order.paymentStatus === "Pago"
        );

        const report = {
          today,
          todayOrders,
          totalOrders: todayOrders.length,
          totalRevenue: 0,
          pastelCount: 0,
          pastelRevenue: 0,
          beverageCount: 0,
          beverageRevenue: 0,
          payments: { PIX: 0, Dinheiro: 0, "Cartão": 0 }
        };

        todayOrders.forEach(order => {
          const total = Number(order.total) || 0;
          report.totalRevenue += total;

          if (Object.prototype.hasOwnProperty.call(report.payments, order.paymentMethod)) {
            report.payments[order.paymentMethod] += total;
          }

          safeItems(order.items).forEach(item => {
            const quantity = Number(item.quantity) || 0;
            const price = Number(item.price) || 0;
            const category = typeof item.category === "string" ? item.category : "";
            const itemTotal = price * quantity;

            if (category.includes("Pastéis")) {
              report.pastelCount += quantity;
              report.pastelRevenue += itemTotal;
            } else if (category.includes("Caldo") || category.includes("Bebidas")) {
              report.beverageCount += quantity;
              report.beverageRevenue += itemTotal;
            }
          });
        });

        return report;
      }, [orders]);

      const handleLogin = async (username, password) => {
        if (!auth || !db) {
          setAuthError("O serviço de autenticação está indisponível.");
          return;
        }

        const normalizedUsername = username.trim();
        const normalizedPassword = password;

        if (!normalizedUsername || !normalizedPassword) {
          setAuthError("Informe usuário e senha.");
          return;
        }

        const email = normalizedUsername.includes("@")
          ? normalizedUsername
          : `${normalizedUsername}@imperiodacana.com`;

        setAuthLoading(true);
        setAuthError("");

        try {
          await auth.signInWithEmailAndPassword(email, normalizedPassword);
        } catch (error) {
          console.error("Falha na autenticação:", error);
          setAuthLoading(false);

          if (["auth/user-not-found", "auth/wrong-password", "auth/invalid-credential"].includes(error.code)) {
            setAuthError("Usuário ou senha incorretos.");
          } else if (error.code === "auth/too-many-requests") {
            setAuthError("Muitas tentativas. Aguarde antes de tentar novamente.");
          } else {
            setAuthError("Não foi possível autenticar. Verifique a conexão e tente novamente.");
          }
        }
      };

      const handleLogout = async () => {
        try {
          await auth.signOut();
          setCart([]);
          setAuthError("");
        } catch (error) {
          console.error("Falha ao sair:", error);
          window.alert("Não foi possível encerrar a sessão. Tente novamente.");
        }
      };

      const addItemToCart = (product, flavor = "") => {
        const normalizedFlavor = flavor || "";
        const uniqueKey = `${product.id}-${normalizedFlavor || "puro"}`;
        const itemName = normalizedFlavor && normalizedFlavor !== "Puro"
          ? `${product.name} (${normalizedFlavor})`
          : product.name;

        setCart(previousCart => {
          const existing = previousCart.find(item => item.uniqueKey === uniqueKey);

          if (existing) {
            return previousCart.map(item =>
              item.uniqueKey === uniqueKey
                ? { ...item, quantity: item.quantity + 1 }
                : item
            );
          }

          return [...previousCart, {
            ...product,
            uniqueKey,
            nameWithFlavor: itemName,
            flavor: normalizedFlavor,
            quantity: 1
          }];
        });

        setFlavorModalItem(null);
      };

      const handleProductClick = product => {
        if (product.hasFlavor) {
          setFlavorModalItem(product);
          setSelectedFlavor("Puro");
        } else {
          addItemToCart(product);
        }
      };

      const updateCartQty = (uniqueKey, delta) => {
        setCart(previousCart => previousCart
          .map(item => {
            if (item.uniqueKey !== uniqueKey) return item;
            const quantity = item.quantity + delta;
            return quantity > 0 ? { ...item, quantity } : null;
          })
          .filter(Boolean)
        );
      };

      const getLegacyHighestOrderNumber = businessDate => {
        return orders.reduce((highest, order) => {
          if (getOrderBusinessDate(order) !== businessDate || typeof order.id !== "string") {
            return highest;
          }

          const match = order.id.match(/^CMD-(\d+)$/);
          return match ? Math.max(highest, Number(match[1])) : highest;
        }, 0);
      };

      const handleCreateOrder = async () => {
        if (!currentUser || !db) {
          window.alert("É necessário estar conectado para lançar um pedido.");
          return;
        }

        if (cart.length === 0) {
          window.alert("Adicione pelo menos um item ao pedido.");
          return;
        }

        if (!Number.isFinite(cartTotal) || cartTotal <= 0) {
          window.alert("O total do pedido é inválido.");
          return;
        }

        const businessDate = localDateKey();
        const initialSequence = getLegacyHighestOrderNumber(businessDate);
        const orderRef = db.collection("orders").doc();
        const counterRef = db.collection("dailyCounters").doc(businessDate);
        const items = cart.map(item => ({
          id: item.id,
          name: item.name,
          nameWithFlavor: item.nameWithFlavor,
          category: item.category,
          price: item.price,
          quantity: item.quantity,
          flavor: item.flavor || ""
        }));

        const orderBase = {
          customer: customerName.trim().slice(0, 100) || "Cliente Balcão",
          type: orderType,
          status: "Aguardando",
          paymentStatus: "Pendente",
          paymentMethod: null,
          createdAt: new Date().toISOString(),
          businessDate,
          items,
          total: cartTotal,
          atendente: currentUser.name,
          atendenteUid: currentUser.uid
        };

        try {
          await db.runTransaction(async transaction => {
            const counterSnapshot = await transaction.get(counterRef);
            const savedSequence = counterSnapshot.exists
              ? Number(counterSnapshot.data().lastNumber) || 0
              : 0;

            const nextSequence = Math.max(savedSequence, initialSequence) + 1;

            transaction.set(counterRef, {
              date: businessDate,
              lastNumber: nextSequence,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            transaction.set(orderRef, {
              ...orderBase,
              id: `CMD-${String(nextSequence).padStart(3, "0")}`
            });
          });

          setCart([]);
          setCustomerName("");
          window.alert("Pedido lançado com sucesso.");
        } catch (error) {
          console.error("Falha ao criar pedido:", error);
          window.alert("O pedido não foi confirmado no banco. O carrinho foi mantido; verifique a conexão e tente novamente.");
        }
      };

      const setOrderBusy = (docId, isBusy) => {
        setBusyOrderIds(previous =>
          isBusy
            ? [...new Set([...previous, docId])]
            : previous.filter(id => id !== docId)
        );
      };

      const handlePayOrder = async (order, method) => {
        if (!db || !order.docId || !PAYMENT_METHODS.includes(method)) {
          window.alert("Não foi possível validar a comanda ou a forma de pagamento.");
          return;
        }

        setOrderBusy(order.docId, true);

        try {
          await db.runTransaction(async transaction => {
            const orderRef = db.collection("orders").doc(order.docId);
            const snapshot = await transaction.get(orderRef);

            if (!snapshot.exists) throw new Error("A comanda não existe mais.");

            const latestOrder = snapshot.data();
            if (latestOrder.paymentStatus === "Pago") {
              throw new Error("Esta comanda já foi paga por outro usuário.");
            }

            transaction.update(orderRef, {
              status: "Entregue",
              paymentStatus: "Pago",
              paymentMethod: method,
              closedAt: new Date().toISOString()
            });
          });
        } catch (error) {
          console.error("Falha ao registrar pagamento:", error);
          window.alert(error.message || "Não foi possível registrar o pagamento.");
        } finally {
          setOrderBusy(order.docId, false);
        }
      };

      const updateOrderStatus = async (order, nextStatus) => {
        if (!db || !order.docId || !ORDER_STATUSES.includes(nextStatus)) {
          window.alert("Não foi possível validar a alteração de status.");
          return;
        }

        const expectedNextStatus = {
          "Aguardando": "Em Fritura",
          "Em Fritura": "Pronto",
          "Pronto": "Entregue"
        };

        if (expectedNextStatus[order.status] !== nextStatus) {
          window.alert("A etapa da comanda mudou. Atualize a tela e tente novamente.");
          return;
        }

        setOrderBusy(order.docId, true);

        try {
          await db.runTransaction(async transaction => {
            const orderRef = db.collection("orders").doc(order.docId);
            const snapshot = await transaction.get(orderRef);

            if (!snapshot.exists) throw new Error("A comanda não existe mais.");

            const latestOrder = snapshot.data();
            if (latestOrder.status !== order.status) {
              throw new Error("A etapa da comanda já foi alterada por outro usuário.");
            }

            transaction.update(orderRef, { status: nextStatus });
          });
        } catch (error) {
          console.error("Falha ao alterar status:", error);
          window.alert(error.message || "Não foi possível alterar o status da comanda.");
        } finally {
          setOrderBusy(order.docId, false);
        }
      };

      const printTicket = order => {
        setPrintingOrder(order);
        document.body.classList.remove("print-report");
        document.body.classList.add("print-ticket");
        window.setTimeout(() => window.print(), 250);
      };

      const printCashReport = () => {
        document.body.classList.remove("print-ticket");
        document.body.classList.add("print-report");
        window.setTimeout(() => window.print(), 150);
      };

      const filteredProducts = INITIAL_CATALOG
        .filter(product => selectedCategory === "Todos" || product.category === selectedCategory)
        .filter(product => product.name.toLowerCase().includes(searchTerm.trim().toLowerCase()));

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-imperio-green text-white">
            <p className="font-bold">Validando acesso...</p>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <LoginScreen
            error={authError || (firebaseInitError ? "Falha na configuração do Firebase." : "")}
            onLogin={handleLogin}
          />
        );
      }

      const canViewDashboard = currentUser.role !== "ATENDENTE";

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          <header className="glass-header sticky top-0 z-30 text-white px-4 py-3 shadow-md flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Logo Império da Cana"
                className="w-10 h-10 rounded-xl object-cover border-2 border-yellow-400 bg-white"
              />
              <div>
                <h1 className="font-extrabold text-yellow-400 text-sm">IMPÉRIO DA CANA</h1>
                <div className="flex items-center gap-2 text-[10px] text-emerald-100">
                  <span className={`w-2 h-2 rounded-full ${isDbConnected ? "bg-emerald-300" : "bg-amber-300"}`}></span>
                  {isDbConnected ? "Nuvem conectada" : "Sem conexão com a nuvem"}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xs bg-emerald-900 px-2.5 py-1 rounded-full font-bold">
                {currentUser.name}
              </span>
              <button
                onClick={handleLogout}
                aria-label="Sair"
                className="p-2 bg-red-600 rounded-xl"
              >
                <i data-lucide="log-out" className="w-4 h-4"></i>
              </button>
            </div>
          </header>

          <aside className="hidden md:flex w-64 min-h-screen bg-imperio-green text-white flex-col flex-shrink-0">
            <div className="p-5 border-b border-emerald-800">
              <h2 className="font-black text-yellow-400">IMPÉRIO DA CANA</h2>
              <span className="text-xs text-emerald-200">Gestão Comercial</span>
            </div>

            <nav className="p-4 space-y-2">
              {canViewDashboard && (
                <NavButton
                  icon="layout-dashboard"
                  label="Caixa Diário"
                  active={activeTab === "dashboard"}
                  onClick={() => setActiveTab("dashboard")}
                />
              )}
              <NavButton
                icon="shopping-bag"
                label="Novo Pedido"
                active={activeTab === "pdv"}
                onClick={() => setActiveTab("pdv")}
              />
              <NavButton
                icon="receipt"
                label="Comandas & Receber"
                active={activeTab === "comandas"}
                onClick={() => setActiveTab("comandas")}
              />
              <NavButton
                icon="utensils"
                label="Cozinha"
                active={activeTab === "kds"}
                onClick={() => setActiveTab("kds")}
              />
            </nav>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 sm:p-6 pb-24 md:pb-6 fade-in">
            {activeTab === "dashboard" && canViewDashboard && (
              <Dashboard report={cashReport} onPrint={printCashReport} />
            )}

            {activeTab === "pdv" && (
              <section className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div className="lg:col-span-2 space-y-4">
                  <div className="bg-white p-4 rounded-3xl border space-y-3">
                    <input
                      type="search"
                      aria-label="Buscar produto"
                      placeholder="Buscar produto..."
                      value={searchTerm}
                      onChange={event => setSearchTerm(event.target.value)}
                      className="w-full px-4 py-3 bg-slate-50 border rounded-2xl text-sm"
                    />

                    <div className="flex gap-2 overflow-x-auto">
                      {["Todos", "Pastéis Salgados", "Caldo de Cana", "Bebidas"].map(category => (
                        <button
                          key={category}
                          onClick={() => setSelectedCategory(category)}
                          className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${
                            selectedCategory === category
                              ? "bg-imperio-green text-yellow-300"
                              : "bg-slate-100 text-slate-700"
                          }`}
                        >
                          {category}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredProducts.map(product => (
                      <button
                        type="button"
                        key={product.id}
                        onClick={() => handleProductClick(product)}
                        className="text-left bg-white p-4 rounded-3xl border hover:border-emerald-700 flex items-center justify-between"
                      >
                        <span>
                          <span className="block text-[10px] uppercase font-bold text-emerald-800">{product.category}</span>
                          <strong className="block mt-1 text-sm">{product.name}</strong>
                          <span className="block text-xs text-slate-500">{product.desc}</span>
                          <strong className="block mt-2 text-emerald-800">{formatCurrency(product.price)}</strong>
                        </span>
                        <span className="w-10 h-10 rounded-xl bg-yellow-400 grid place-items-center font-black">+</span>
                      </button>
                    ))}
                    {filteredProducts.length === 0 && (
                      <p className="col-span-full text-center p-8 text-slate-500">Nenhum produto encontrado.</p>
                    )}
                  </div>
                </div>

                <section className="bg-white p-5 rounded-3xl border h-fit space-y-4">
                  <h2 className="font-black text-lg">Carrinho</h2>

                  <label className="block text-xs font-bold">
                    Cliente / comanda
                    <input
                      value={customerName}
                      onChange={event => setCustomerName(event.target.value)}
                      maxLength={100}
                      placeholder="Ex.: João / Mesa 02"
                      className="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm"
                    />
                  </label>

                  <label className="block text-xs font-bold">
                    Local
                    <select
                      value={orderType}
                      onChange={event => setOrderType(event.target.value)}
                      className="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm"
                    >
                      <option value="Balcão">Balcão (Viagem)</option>
                      <option value="Mesa 01">Mesa 01</option>
                      <option value="Mesa 02">Mesa 02</option>
                      <option value="Mesa 03">Mesa 03</option>
                      <option value="Mesa 04">Mesa 04</option>
                    </select>
                  </label>

                  <div className="space-y-2 max-h-72 overflow-y-auto">
                    {cart.length === 0 && (
                      <p className="py-6 text-center text-xs text-slate-500">O carrinho está vazio.</p>
                    )}
                    {cart.map(item => (
                      <div key={item.uniqueKey} className="p-3 bg-slate-50 rounded-xl border">
                        <div className="flex justify-between gap-2 text-xs font-bold">
                          <span>{item.nameWithFlavor}</span>
                          <span>{formatCurrency(item.price * item.quantity)}</span>
                        </div>
                        <div className="mt-2 flex items-center gap-3">
                          <button onClick={() => updateCartQty(item.uniqueKey, -1)} className="w-7 h-7 bg-slate-200 rounded-lg">-</button>
                          <span className="text-sm font-bold">{item.quantity}</span>
                          <button onClick={() => updateCartQty(item.uniqueKey, 1)} className="w-7 h-7 bg-slate-200 rounded-lg">+</button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="border-t pt-3 flex justify-between font-black">
                    <span>Total</span>
                    <span className="text-emerald-800">{formatCurrency(cartTotal)}</span>
                  </div>

                  <button
                    disabled={cart.length === 0}
                    onClick={handleCreateOrder}
                    className="w-full py-3 bg-imperio-green text-yellow-300 font-black rounded-xl disabled:opacity-50"
                  >
                    Lançar pedido
                  </button>
                </section>
              </section>
            )}

            {activeTab === "comandas" && (
              <section className="space-y-4">
                <div className="bg-white p-4 rounded-2xl border flex justify-between items-center">
                  <div>
                    <h2 className="font-bold">Comandas</h2>
                    <p className="text-xs text-slate-500">
                      {ordersLoading ? "Carregando..." : "Pedidos registrados no sistema"}
                    </p>
                  </div>
                  <span className="text-xs font-bold bg-yellow-300 px-3 py-1 rounded-full">
                    {orders.filter(order => order.paymentStatus !== "Pago").length} abertas
                  </span>
                </div>

                {!ordersLoading && orders.length === 0 && (
                  <div className="p-10 bg-white rounded-2xl text-center text-slate-500">
                    Nenhuma comanda encontrada.
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                  {orders.map(order => {
                    const isPaid = order.paymentStatus === "Pago";
                    const isBusy = busyOrderIds.includes(order.docId);

                    return (
                      <article
                        key={order.docId}
                        className={`bg-white rounded-2xl p-4 border ${isPaid ? "border-emerald-300" : "border-yellow-400"}`}
                      >
                        <div className="flex justify-between gap-3 border-b pb-2">
                          <div>
                            <strong className="text-emerald-900">{order.id || "Comanda"}</strong>
                            <p className="text-xs">{order.customer || "Cliente"} · {order.type || "Balcão"}</p>
                            <p className="text-[10px] text-slate-500">{formatOrderDate(order.createdAt)}</p>
                          </div>
                          <span className="text-xs font-bold">{isPaid ? "Paga" : "Em aberto"}</span>
                        </div>

                        <ul className="py-3 space-y-1 text-xs">
                          {safeItems(order.items).map((item, index) => (
                            <li key={`${item.id || item.name}-${index}`} className="flex justify-between gap-2">
                              <span>{Number(item.quantity) || 0} × {item.nameWithFlavor || item.name || "Item"}</span>
                              <span>{formatCurrency((Number(item.price) || 0) * (Number(item.quantity) || 0))}</span>
                            </li>
                          ))}
                        </ul>

                        <div className="border-t pt-3 flex justify-between font-black">
                          <span>Total</span>
                          <span>{formatCurrency(order.total)}</span>
                        </div>

                        {!isPaid ? (
                          <div className="grid grid-cols-3 gap-2 mt-3">
                            {PAYMENT_METHODS.map(method => (
                              <button
                                key={method}
                                disabled={isBusy}
                                onClick={() => handlePayOrder(order, method)}
                                className="py-2 px-1 bg-emerald-700 text-white rounded-lg text-xs font-bold disabled:opacity-50"
                              >
                                {method}
                              </button>
                            ))}
                          </div>
                        ) : (
                          <div className="flex justify-between items-center mt-3 text-xs">
                            <span>Pago em {order.paymentMethod || "—"}</span>
                            <button
                              onClick={() => printTicket(order)}
                              className="px-3 py-2 bg-slate-200 rounded-lg font-bold"
                            >
                              Imprimir cupom
                            </button>
                          </div>
                        )}
                      </article>
                    );
                  })}
                </div>
              </section>
            )}

            {activeTab === "kds" && (
              <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {["Aguardando", "Em Fritura", "Pronto"].map(status => {
                  const statusOrders = orders.filter(order => order.status === status);

                  return (
                    <div key={status} className="bg-white rounded-2xl border p-4">
                      <h2 className="font-black border-b pb-2 mb-3">
                        {status} <span className="text-slate-500">({statusOrders.length})</span>
                      </h2>

                      <div className="space-y-3">
                        {statusOrders.map(order => {
                          const nextStatus = {
                            "Aguardando": "Em Fritura",
                            "Em Fritura": "Pronto",
                            "Pronto": "Entregue"
                          }[status];

                          return (
                            <article key={order.docId} className="p-3 bg-slate-50 rounded-xl border">
                              <strong className="text-sm">{order.id} · {order.customer}</strong>
                              <p className="text-xs text-slate-500">{order.type}</p>
                              <ul className="py-2 text-xs">
                                {safeItems(order.items).map((item, index) => (
                                  <li key={`${item.id || item.name}-${index}`}>
                                    {Number(item.quantity) || 0} × {item.nameWithFlavor || item.name || "Item"}
                                  </li>
                                ))}
                              </ul>
                              <button
                                disabled={busyOrderIds.includes(order.docId)}
                                onClick={() => updateOrderStatus(order, nextStatus)}
                                className="w-full py-2 bg-imperio-green text-white rounded-lg text-xs font-bold disabled:opacity-50"
                              >
                                {nextStatus === "Entregue" ? "Marcar entregue" : `Avançar para ${nextStatus}`}
                              </button>
                            </article>
                          );
                        })}
                        {statusOrders.length === 0 && (
                          <p className="py-5 text-center text-xs text-slate-500">Nenhuma comanda nesta etapa.</p>
                        )}
                      </div>
                    </div>
                  );
                })}
              </section>
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 glass-header px-2 py-2 flex justify-around text-white">
            {canViewDashboard && (
              <MobileNavButton
                icon="layout-dashboard"
                label="Caixa"
                active={activeTab === "dashboard"}
                onClick={() => setActiveTab("dashboard")}
              />
            )}
            <MobileNavButton
              icon="shopping-bag"
              label="Pedido"
              active={activeTab === "pdv"}
              onClick={() => setActiveTab("pdv")}
            />
            <MobileNavButton
              icon="receipt"
              label="Comandas"
              active={activeTab === "comandas"}
              onClick={() => setActiveTab("comandas")}
            />
            <MobileNavButton
              icon="utensils"
              label="Cozinha"
              active={activeTab === "kds"}
              onClick={() => setActiveTab("kds")}
            />
          </nav>

          {flavorModalItem && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4">
                <h2 className="text-center font-black text-lg">Escolha o sabor</h2>
                <p className="text-center text-xs text-slate-500">{flavorModalItem.name}</p>
                <div className="space-y-2">
                  {FLAVORS.map(flavor => (
                    <button
                      key={flavor}
                      onClick={() => setSelectedFlavor(flavor)}
                      className={`w-full p-3 rounded-xl border text-sm font-bold ${
                        selectedFlavor === flavor ? "bg-imperio-green text-yellow-300" : "bg-slate-50"
                      }`}
                    >
                      {flavor}
                    </button>
                  ))}
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => setFlavorModalItem(null)} className="p-3 bg-slate-200 rounded-xl font-bold">Cancelar</button>
                  <button onClick={() => addItemToCart(flavorModalItem, selectedFlavor)} className="p-3 bg-yellow-400 rounded-xl font-black">Confirmar</button>
                </div>
              </div>
            </div>
          )}

          {printingOrder && (
            <div id="printable-ticket">
              <div style={{ textAlign: "center" }}>
                <strong>IMPÉRIO DA CANA</strong>
                <div>PASTEL E CALDO DE CANA</div>
                <div>Tel: (14) 99843-8050</div>
                <hr />
              </div>
              <p><strong>COMANDA: {printingOrder.id}</strong></p>
              <p>Cliente: {printingOrder.customer}</p>
              <p>Local: {printingOrder.type}</p>
              <p>Data: {formatOrderDate(printingOrder.createdAt)}</p>
              <hr />
              {safeItems(printingOrder.items).map((item, index) => (
                <p key={index}>
                  {item.quantity} × {item.nameWithFlavor || item.name} —{" "}
                  {formatCurrency((Number(item.price) || 0) * (Number(item.quantity) || 0))}
                </p>
              ))}
              <hr />
              <strong>TOTAL: {formatCurrency(printingOrder.total)}</strong>
              <p>Pagamento: {printingOrder.paymentMethod || "Pendente"}</p>
            </div>
          )}

          <div id="printable-report">
            <div style={{ textAlign: "center" }}>
              <h1>IMPÉRIO DA CANA</h1>
              <h3>RELATÓRIO DE FECHAMENTO DE CAIXA</h3>
              <p>Data: {new Date().toLocaleDateString("pt-BR")}</p>
              <hr />
            </div>

            <h4>RESUMO GERAL</h4>
            <p>Comandas pagas: <strong>{cashReport.totalOrders}</strong></p>
            <p>Pastéis vendidos: <strong>{cashReport.pastelCount}</strong> — {formatCurrency(cashReport.pastelRevenue)}</p>
            <p>Bebidas e caldos: <strong>{cashReport.beverageCount}</strong> — {formatCurrency(cashReport.beverageRevenue)}</p>
            <h3>FATURAMENTO TOTAL: {formatCurrency(cashReport.totalRevenue)}</h3>

            <h4>FORMAS DE PAGAMENTO</h4>
            <p>PIX: {formatCurrency(cashReport.payments.PIX)}</p>
            <p>Dinheiro: {formatCurrency(cashReport.payments.Dinheiro)}</p>
            <p>Cartão: {formatCurrency(cashReport.payments["Cartão"])}</p>

            <h4>COMANDAS PAGAS</h4>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "11px" }}>
              <thead>
                <tr>
                  <th style={{ textAlign: "left" }}>Comanda</th>
                  <th style={{ textAlign: "left" }}>Cliente</th>
                  <th style={{ textAlign: "left" }}>Pagamento</th>
                  <th style={{ textAlign: "right" }}>Valor</th>
                </tr>
              </thead>
              <tbody>
                {cashReport.todayOrders.map(order => (
                  <tr key={order.docId}>
                    <td>{order.id}</td>
                    <td>{order.customer}</td>
                    <td>{order.paymentMethod || "—"}</td>
                    <td style={{ textAlign: "right" }}>{formatCurrency(order.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function NavButton({ icon, label, active, onClick }) {
      return (
        <button
          onClick={onClick}
          className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold ${
            active ? "bg-yellow-400 text-emerald-950" : "text-emerald-100 hover:bg-emerald-800"
          }`}
        >
          <i data-lucide={icon} className="w-5 h-5"></i>
          {label}
        </button>
      );
    }

    function MobileNavButton({ icon, label, active, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center px-2 py-1 ${active ? "text-yellow-300" : "text-emerald-100"}`}>
          <i data-lucide={icon} className="w-5 h-5"></i>
          <span className="text-[10px]">{label}</span>
        </button>
      );
    }

    function Dashboard({ report, onPrint }) {
      return (
        <section className="space-y-5">
          <div className="bg-gradient-to-br from-emerald-900 to-emerald-950 text-white p-6 rounded-3xl shadow-lg">
            <div className="flex flex-wrap justify-between items-center gap-3 border-b border-emerald-700 pb-4">
              <div>
                <span className="text-xs text-yellow-300 font-bold">
                  Fechamento de hoje — {new Date().toLocaleDateString("pt-BR")}
                </span>
                <h2 className="text-2xl font-black mt-1">Balanço de vendas</h2>
              </div>
              <button onClick={onPrint} className="px-4 py-3 bg-yellow-400 text-emerald-950 rounded-xl text-xs font-black">
                Imprimir relatório
              </button>
            </div>

            <div className="grid sm:grid-cols-3 gap-3 mt-5">
              <Metric label="Faturamento total" value={formatCurrency(report.totalRevenue)} detail={`${report.totalOrders} comandas pagas`} />
              <Metric label="Pastéis vendidos" value={`${report.pastelCount} un.`} detail={formatCurrency(report.pastelRevenue)} />
              <Metric label="Bebidas e caldos" value={`${report.beverageCount} un.`} detail={formatCurrency(report.beverageRevenue)} />
            </div>

            <div className="grid grid-cols-3 gap-2 mt-4 text-center">
              {PAYMENT_METHODS.map(method => (
                <div key={method} className="p-3 bg-emerald-950 rounded-xl">
                  <span className="block text-xs text-emerald-200">{method}</span>
                  <strong className="text-yellow-300">{formatCurrency(report.payments[method])}</strong>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Metric({ label, value, detail }) {
      return (
        <div className="p-4 rounded-2xl bg-emerald-950/70 border border-emerald-800">
          <span className="text-xs text-emerald-200">{label}</span>
          <strong className="block text-xl text-yellow-300 mt-1">{value}</strong>
          <span className="text-xs text-emerald-100">{detail}</span>
        </div>
      );
    }

    function LoginScreen({ error, onLogin }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [submitting, setSubmitting] = useState(false);

      const submit = async event => {
        event.preventDefault();
        setSubmitting(true);
        await onLogin(username, password);
        setSubmitting(false);
      };

      const fillAttendantUsername = () => {
        setUsername("atendente");
        setPassword("");
      };

      return (
        <div className="min-h-screen bg-imperio-green flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-5 border-4 border-yellow-400 fade-in">
            <div className="text-center">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Logo Império da Cana"
                className="w-24 h-24 mx-auto rounded-2xl object-cover border-4 border-yellow-400 bg-white"
              />
              <h1 className="mt-3 text-xl font-black text-emerald-950">IMPÉRIO DA CANA</h1>
              <p className="text-xs text-slate-500">Agudos, SP · (14) 99843-8050</p>
            </div>

            <div>
              <span className="block mb-2 text-[10px] uppercase font-black text-slate-400">Acesso rápido</span>
              <button
                type="button"
                onClick={fillAttendantUsername}
                className="w-full py-2 bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-xl font-bold text-sm"
              >
                Atendente
              </button>
            </div>

            <form onSubmit={submit} className="space-y-3">
              {error && <div role="alert" className="p-3 bg-red-100 text-red-700 rounded-xl text-xs font-bold">{error}</div>}

              <label className="block text-xs font-bold">
                Usuário ou e-mail
                <input
                  type="text"
                  autoComplete="username"
                  required
                  value={username}
                  onChange={event => setUsername(event.target.value)}
                  className="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm"
                />
              </label>

              <label className="block text-xs font-bold">
                Senha
                <input
                  type="password"
                  autoComplete="current-password"
                  required
                  value={password}
                  onChange={event => setPassword(event.target.value)}
                  className="mt-1 w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm"
                />
              </label>

              <button
                type="submit"
                disabled={submitting}
                className="w-full py-3 bg-imperio-green text-yellow-300 font-black rounded-xl disabled:opacity-50"
              >
                {submitting ? "Autenticando..." : "Entrar no sistema"}
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
