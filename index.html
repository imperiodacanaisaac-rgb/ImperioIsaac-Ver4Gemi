      body.print-report #printable-ticket, body.print-ticket #printable-report { display: none !important; }

      }
    }
  </style>
</head>

    ];

    const FLAVORS = ['Puro', 'Limão', 'Maracujá', 'Caju', 'Abacaxi'];

    // Perfis: DEV e ADMIN (gestores) e BALCAO (atendentes; "ATENDENTE" é aceito como sinônimo).
    // Ajuste conforme o campo "role" gravado em usuarios/{uid}.
    const normRole = (r) => { const x = String(r || '').toUpperCase(); return x === 'ATENDENTE' ? 'BALCAO' : x; };
    const isGestorRole = (r) => ['DEV', 'ADMIN'].includes(normRole(r));
    const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const splitOrder = (o) => {
      let pasteis = 0, caldosBebidas = 0;
      (o.items || []).forEach(it => {
        const v = (it.price || 0) * (it.quantity || 0), c = it.category || '';
        if (c.includes('Pastéis')) pasteis += v;
        else if (c.includes('Caldo') || c.includes('Bebidas')) caldosBebidas += v;
      });
      return { pasteis, caldosBebidas };
    };

    // Data local (YYYY-MM-DD) — evita o desvio de fuso do toISOString (UTC)
    const localDate = (d = new Date()) => d.toLocaleDateString('sv-SE');
    const orderPaidDate = (o) => localDate(new Date(o.closedAt || o.createdAt));
    const hideImg = (e) => { e.currentTarget.style.display = 'none'; };
    // Nome de exibição tolerante a perfis sem o campo "name"
    const userLabel = (u) => (u && (u.name || u.nome || u.displayName || u.email)) || 'Balcão';

    // ===== Impressora térmica Bluetooth (BLE) =====
    const PRINTER_SERVICES = [0xff00, 0xffe0, 0x18f0, 0xfee7, 0xae30, 0xfff0,
      '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
      '0000ff00-0000-1000-8000-00805f9b34fb'];
    const printerBt = { device: null, char: null, handler: null };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function btConnect(device) {
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      for (const svc of services) {
        try {
          const chars = await svc.getCharacteristics();
          const w = chars.find(c => c.properties.writeWithoutResponse || c.properties.write);
          if (w) { printerBt.char = w; printerBt.device = device; return; }
        } catch (e) {}
      }
      throw new Error('Nenhum canal de escrita encontrado nesta impressora.');
    }
    async function btAttach(device, setOn) {
      if (printerBt.device && printerBt.handler) printerBt.device.removeEventListener('gattserverdisconnected', printerBt.handler);
      const handler = async () => {
        setOn(false);
        for (let i = 0; i < 3; i++) {
          await sleep(2000);
          try { await btConnect(device); setOn(true); return; } catch (e) {}
        }
      };
      printerBt.handler = handler;
      device.addEventListener('gattserverdisconnected', handler);
      await btConnect(device);
    }
    function btDetach() {
      try {
        if (printerBt.device) {
          printerBt.device.removeEventListener('gattserverdisconnected', printerBt.handler);
          if (printerBt.device.gatt.connected) printerBt.device.gatt.disconnect();
        }
      } catch (e) {}
      printerBt.device = null; printerBt.char = null; printerBt.handler = null;
    }
    async function btWrite(bytes) {
      if (!printerBt.device) throw new Error('Impressora não conectada');
      if (!printerBt.device.gatt.connected || !printerBt.char) await btConnect(printerBt.device);
      const c = printerBt.char;
      for (let i = 0; i < bytes.length; i += 100) {
        const chunk = bytes.slice(i, i + 100);
        if (c.properties.writeWithoutResponse) await c.writeValueWithoutResponse(chunk);
        else await c.writeValue(chunk);
        await sleep(30);
      }
    }
    const ascii = (t) => String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '?');

    function buildTicket(order, cols) {
      const enc = new TextEncoder(), parts = [];
      const cmd = (...b) => parts.push(Uint8Array.from(b));
      const text = (t) => parts.push(enc.encode(ascii(t) + '\n'));
      const two = (L, R) => L.padEnd(cols - R.length, ' ') + R;
      const item = (l, r) => {
        const L = ascii(l), R = ascii(r);
        if (L.length + R.length < cols) return text(two(L, R));
        for (let i = 0; i < L.length; i += cols) text(L.slice(i, i + cols));
        text(' '.repeat(cols - R.length) + R);
      };
      const dash = '-'.repeat(cols);
      cmd(0x1b, 0x40);
      cmd(0x1b, 0x61, 1); cmd(0x1b, 0x45, 1); cmd(0x1d, 0x21, 0x11); text('IMPERIO DA CANA'); cmd(0x1d, 0x21, 0);
      cmd(0x1b, 0x45, 0); text('PASTEL E CALDO DE CANA'); text('Tel: (14) 99843-8050'); text(dash);
      cmd(0x1b, 0x61, 0); cmd(0x1b, 0x45, 1); text('COMANDA: ' + order.id); cmd(0x1b, 0x45, 0);
      text('Cliente: ' + order.customer); text('Local: ' + order.type);
      text('Data: ' + new Date(order.createdAt).toLocaleString('pt-BR')); text(dash);
      (order.items || []).forEach(it => item(`${it.quantity}x ${it.nameWithFlavor || it.name}`, ((it.price || 0) * (it.quantity || 0)).toFixed(2)));
      text(dash);
      cmd(0x1b, 0x45, 1); item('TOTAL', 'R$ ' + (order.total || 0).toFixed(2)); cmd(0x1b, 0x45, 0);
      if (order.atendente) text('Atendente: ' + order.atendente);
      cmd(0x1b, 0x61, 1); text('Obrigado pela preferencia!'); cmd(0x1b, 0x64, 4);
      const out = new Uint8Array(parts.reduce((a, x) => a + x.length, 0));
      let o = 0; parts.forEach(x => { out.set(x, o); o += x.length; });
      return out;
    }

    function Status({ cloud, printer }) {
      return (
        <div className="flex items-center gap-x-3 gap-y-0.5 flex-wrap">
          <div className="flex items-center gap-1.5">
            <span className={`w-2 h-2 rounded-full ${cloud ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
            <span className="text-[10px] text-emerald-200 font-semibold">{cloud ? 'Nuvem Conectada' : 'Modo Offline'}</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className={`w-2 h-2 rounded-full ${printer ? 'bg-emerald-400' : 'bg-red-400'}`}></span>
            <span className="text-[10px] text-emerald-200 font-semibold">{printer ? 'Impressora conectada' : 'Impressora desconectada'}</span>
          </div>
        </div>
      );
    }

    // Ícones Lucide renderizados como HTML estático (não mutam o DOM do React)
    function Icon({ name, className }) {
      const html = useMemo(() => {
        try {
          const key = name.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
          const def = window.lucide && window.lucide.icons && window.lucide.icons[key];
          if (!def) return '';
          const el = window.lucide.createElement(def);
          el.setAttribute('class', className || '');
          return el.outerHTML;
        } catch (e) { return ''; }
      }, [name, className]);
      return <span className="inline-flex shrink-0" aria-hidden="true" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authReady, setAuthReady] = useState(!auth);
      const [toast, setToast] = useState(null);
      const [saving, setSaving] = useState(false);
      const [printerOn, setPrinterOn] = useState(false);
      const [printerName, setPrinterName] = useState('');
      const [printerBusy, setPrinterBusy] = useState(false);
      const [printerCols, setPrinterCols] = useState(() => { try { return Number(localStorage.getItem('imperio_cols')) || 32; } catch (e) { return 32; } });
      const [printPrompt, setPrintPrompt] = useState(null);
      const [balYear, setBalYear] = useState(new Date().getFullYear());
      const [balData, setBalData] = useState(null);
      const [balLoading, setBalLoading] = useState(false);
      const [balNonce, setBalNonce] = useState(0);
      const [editingOrder, setEditingOrder] = useState(null);
      const [cancelTarget, setCancelTarget] = useState(null);
      const [cancelReason, setCancelReason] = useState('');
      const [cancelBusy, setCancelBusy] = useState(false);

      const [activeTab, setActiveTab] = useState('pdv');
      const [orders, setOrders] = useState([]);
      const [cart, setCart] = useState([]);
      const [customerName, setCustomerName] = useState('');
      const [orderType, setOrderType] = useState('Balcão');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [isDbConnected, setIsDbConnected] = useState(false);

      const [flavorModalItem, setFlavorModalItem] = useState(null);
      const [selectedFlavor, setSelectedFlavor] = useState('Puro');
      const [printingOrder, setPrintingOrder] = useState(null);

      const notify = (msg, type = 'ok') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Sessão: a fonte da verdade é o Firebase Auth + perfil em usuarios/{uid}
      useEffect(() => {
        if (!auth || !db) return;
        return auth.onAuthStateChanged(async (user) => {
          if (!user) { setCurrentUser(null); setAuthReady(true); return; }
          try {
            const snap = await db.collection('usuarios').doc(user.uid).get();
            if (snap.exists && snap.data().ativo) {
              setCurrentUser(snap.data());
            } else {
              setCurrentUser(null);
              await auth.signOut();
            }
          } catch (e) { setCurrentUser(null); }
          setAuthReady(true);
        });
      }, []);

      // Limpa o modo de impressão quando o diálogo fecha
      useEffect(() => {
        const clean = () => {
          document.body.classList.remove('print-ticket', 'print-report');
          setPrintingOrder(null);
        };
        window.addEventListener('afterprint', clean);
        return () => window.removeEventListener('afterprint', clean);
      }, []);

      // CONEXÃO FIRESTORE
      useEffect(() => {
        if (db && currentUser) {
          const unsubscribe = db.collection('orders').orderBy('createdAt', 'desc').limit(300).onSnapshot(
            { includeMetadataChanges: true },
            snapshot => {
              const fetched = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
              setOrders(fetched);
              setIsDbConnected(!snapshot.metadata.fromCache);
            },
            err => {
              console.warn("Aviso Firestore:", err);
              if (err.code === "permission-denied") notify("Sem permissão para ler os pedidos.", "err");
              setIsDbConnected(false);
            }
          );
          return () => unsubscribe();
        } else {
          setIsDbConnected(false);
        }
      }, [currentUser]);

      const handleLoginSuccess = (userData) => {
        setCurrentUser(userData);
        setActiveTab(isGestorRole(userData.role) ? 'dashboard' : 'pdv');
      };

      const handleLogout = () => {
        if (auth) auth.signOut();
        setCurrentUser(null);
        setCart([]); setOrders([]); setEditingOrder(null);
      };

      const handleProductClick = (product) => {
        if (product.hasFlavor) {
          setFlavorModalItem(product);
          setSelectedFlavor('Puro');
        } else {
          addItemToCart(product, '');
        }
      };

      const addItemToCart = (product, flavor) => {
        const itemName = flavor && flavor !== 'Puro' ? `${product.name} (${flavor})` : product.name;
        setCart(prev => {
          const existing = prev.find(i => i.id === product.id && i.flavor === flavor);
          if (existing) {
            return prev.map(i => i.id === product.id && i.flavor === flavor ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...product, uniqueKey: `${product.id}-${flavor || 'puro'}`, nameWithFlavor: itemName, flavor, quantity: 1, obs: '' }];
        });
        setFlavorModalItem(null);
      };

      const updateCartQty = (uniqueKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.uniqueKey === uniqueKey) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = useMemo(() => Math.round(cart.reduce((acc, i) => acc + (i.price * i.quantity), 0) * 100) / 100, [cart]);

      // Numeração diária via transação (sem duplicar entre aparelhos)
      const generateOrderNum = async () => {
        const ref = db.collection('counters').doc(localDate());
        const run = db.runTransaction(async (tx) => {
          const snap = await tx.get(ref);
          const next = (snap.exists ? snap.data().last : 0) + 1;
          tx.set(ref, { last: next });
          return next;
        });
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000));
        try {
          const n = await Promise.race([run, timeout]);
          return `CMD-${String(n).padStart(3, '0')}`;
        } catch (e) {
          return `CMD-OFF-${Date.now().toString().slice(-5)}`; // sem conexão
        }
      };

      const handleCreateOrder = async () => {
        if (cart.length === 0) return notify('Adicione pelo menos um item ao pedido.', 'err');
        if (!db) return notify('Banco de dados indisponível.', 'err');
        if (saving) return;
        setSaving(true);
        try {
          const id = await generateOrderNum();
          const order = {
            id,
            customer: customerName.trim() || 'Cliente Balcão',
            type: orderType,
            status: 'Aguardando',
            paymentStatus: 'Pendente',
            paymentMethod: null,
            createdAt: new Date().toISOString(),
            items: [...cart],
            total: cartTotal,
            atendente: userLabel(currentUser)
          };
          // Não aguardamos o ack do servidor: offline, o Firestore guarda e sincroniza depois
          const ref = db.collection('orders').doc();
          ref.set(JSON.parse(JSON.stringify(order)))
            .catch(() => notify(`Falha ao gravar ${id}. Refaça o pedido.`, 'err'));
          notify(isDbConnected ? `Comanda ${id} lançada.` : `Comanda ${id} salva offline; será enviada ao reconectar.`);
          setPrintPrompt({ ...order, docId: ref.id });
          setCart([]);
          setCustomerName('');
        } catch (err) {
          console.error('Erro ao lançar pedido:', err);
          notify('Erro ao lançar o pedido: ' + (err.message || 'tente novamente'), 'err');
        } finally {
          setSaving(false);
        }
      };

      // Pagamento NÃO altera o status de produção (o pedido continua na cozinha até ser entregue)
      const handlePayOrder = async (orderId, docId, method) => {
        if (!db || !docId) return notify('Pedido ainda não sincronizado.', 'err');
        const ref = db.collection('orders').doc(docId);
        try {
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(ref);
            if (snap.data().paymentStatus === 'Pago') throw new Error('already');
            const o = snap.data();
            const g = splitOrder(o);
            const FV = firebase.firestore.FieldValue;
            tx.update(ref, { paymentStatus: 'Pago', paymentMethod: method, closedAt: new Date().toISOString() });
            tx.set(db.collection('resumos').doc(localDate().slice(0, 7)), {
              pasteis: FV.increment(g.pasteis), caldosBebidas: FV.increment(g.caldosBebidas),
              total: FV.increment(o.total || 0), pedidos: FV.increment(1)
            }, { merge: true });
          });
          notify(`${orderId} paga em ${method}.`);
        } catch (e) {
          notify(e.message === 'already' ? 'Esta comanda já foi paga.' : 'Não foi possível registrar o pagamento. Verifique a conexão.', 'err');
        }
      };

      const updateOrderStatus = (docId, orderId, newStatus) => {
        if (!db || !docId) return;
        db.collection('orders').doc(docId).update({ status: newStatus })
          .catch(() => notify('Falha ao atualizar o status.', 'err'));
      };

      const handlePrintTicket = (order) => {
        document.body.classList.remove('print-report');
        document.body.classList.add('print-ticket');
        setPrintingOrder({ ...order });
      };

      useEffect(() => {
        if (!printingOrder) return;
        const t = setTimeout(() => window.print(), 150);
        return () => clearTimeout(t);
      }, [printingOrder]);

      const handlePrintCashReport = () => {
        document.body.classList.remove('print-ticket');
        document.body.classList.add('print-report');
        setTimeout(() => window.print(), 150);
      };

      const startAddItems = (order) => {
        if (order.paymentStatus === 'Pago' || order.status === 'Cancelado') return notify('Só é possível adicionar itens em comandas em aberto.', 'err');
        if (cart.length > 0 && !confirm('O carrinho atual será descartado. Continuar?')) return;
        setCart([]);
        setEditingOrder(order);
        setActiveTab('pdv');
        notify(`Adicionando itens à ${order.id} (nome e local não mudam).`);
      };

      const discardCart = () => {
        if (editingOrder) { setEditingOrder(null); setCart([]); return; }
        if (confirm('Cancelar este pedido e descartar os itens do carrinho?')) { setCart([]); setCustomerName(''); }
      };

      const handleAddItems = async () => {
        if (!editingOrder) return;
        if (cart.length === 0) return notify('Adicione itens ao carrinho.', 'err');
        if (!db || !editingOrder.docId) return notify('Comanda ainda não sincronizada.', 'err');
        if (saving) return;
        setSaving(true);
        const ref = db.collection('orders').doc(editingOrder.docId);
        const now = new Date().toISOString();
        try {
          const updated = await db.runTransaction(async (tx) => {
            const snap = await tx.get(ref);
            const o = snap.data();
            if (o.paymentStatus === 'Pago' || o.status === 'Cancelado') throw new Error('closed');
            const items = [...(o.items || []), ...cart.map(c => ({ ...c, addedAt: now }))];
            const total = Math.round(items.reduce((a, i) => a + (i.price || 0) * (i.quantity || 0), 0) * 100) / 100;
            const status = (o.status === 'Pronto' || o.status === 'Entregue') ? 'Aguardando' : o.status;
            tx.update(ref, JSON.parse(JSON.stringify({ items, total, status, lastAddedAt: now })));
            return { ...o, docId: editingOrder.docId, items, total, status };
          });
          notify(`Itens adicionados à ${updated.id}.`);
          setPrintPrompt({ ...updated, _updated: true });
          setCart([]);
          setEditingOrder(null);
          setActiveTab('comandas');
        } catch (e) {
          notify(e.message === 'closed' ? 'Esta comanda já foi paga ou cancelada.' : 'Não foi possível adicionar os itens. Verifique a conexão.', 'err');
        }
        setSaving(false);
      };

      const confirmCancel = async () => {
        const reason = cancelReason.trim();
        if (reason.length < 3) return notify('Informe o motivo do cancelamento.', 'err');
        if (!db || !cancelTarget || !cancelTarget.docId) return notify('Comanda ainda não sincronizada.', 'err');
        setCancelBusy(true);
        const ref = db.collection('orders').doc(cancelTarget.docId);
        try {
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(ref);
            const o = snap.data();
            if (o.status === 'Cancelado') throw new Error('already');
            const wasPaid = o.paymentStatus === 'Pago';
            if (wasPaid && !isGestor) throw new Error('paid');
            tx.update(ref, { status: 'Cancelado', paymentStatus: 'Cancelado', wasPaid, cancelReason: reason,
              cancelledAt: new Date().toISOString(), cancelledBy: userLabel(currentUser) });
            if (wasPaid) { // estorna o resumo mensal do balanço
              const g = splitOrder(o), FV = firebase.firestore.FieldValue;
              tx.set(db.collection('resumos').doc(orderPaidDate(o).slice(0, 7)), {
                pasteis: FV.increment(-g.pasteis), caldosBebidas: FV.increment(-g.caldosBebidas),
                total: FV.increment(-(o.total || 0)), pedidos: FV.increment(-1)
              }, { merge: true });
            }
          });
          notify(`Comanda ${cancelTarget.id} cancelada.`);
          setCancelTarget(null); setCancelReason('');
        } catch (e) {
          notify(e.message === 'already' ? 'Esta comanda já foi cancelada.' : e.message === 'paid' ? 'Só o administrador cancela comanda já paga.' : 'Não foi possível cancelar. Verifique a conexão.', 'err');
        }
        setCancelBusy(false);
      };

      const connectPrinter = async () => {
        if (!navigator.bluetooth) return notify('Este navegador não suporta Bluetooth. Use o Chrome/Edge no PC ou no Android.', 'err');
        setPrinterBusy(true);
        try {
          const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: PRINTER_SERVICES });
          await btAttach(device, setPrinterOn);
          setPrinterName(device.name || 'Impressora');
          setPrinterOn(true);
          try { localStorage.setItem('imperio_printer', device.id); } catch (e) {}
          notify('Impressora conectada.');
        } catch (e) {
          if (e.name !== 'NotFoundError') notify('Não foi possível conectar: ' + e.message, 'err');
        }
        setPrinterBusy(false);
      };
      const disconnectPrinter = () => {
        btDetach(); setPrinterOn(false); setPrinterName('');
        try { localStorage.removeItem('imperio_printer'); } catch (e) {}
      };
      const changeCols = (c) => { setPrinterCols(c); try { localStorage.setItem('imperio_cols', String(c)); } catch (e) {} };
      const printOrder = async (order) => {
        if (printerOn) {
          try { await btWrite(buildTicket(order, printerCols)); notify(`Comanda ${order.id} enviada para a impressora.`); return; }
          catch (e) { setPrinterOn(false); notify('Falha na impressora Bluetooth; abrindo a impressão do navegador.', 'err'); }
        }
        handlePrintTicket(order);
      };
      const printTest = () => printOrder({ id: 'TESTE', customer: 'Teste de impressão', type: 'Balcão', createdAt: new Date().toISOString(),
        items: [{ quantity: 1, nameWithFlavor: 'Pastel de Carne', price: 12 }], total: 12, atendente: userLabel(currentUser) });

      const recalcYear = async () => {
        if (!db || !confirm(`Recalcular os 12 meses de ${balYear} a partir dos pedidos pagos?`)) return;
        setBalLoading(true);
        try {
          const snap = await db.collection('orders')
            .where('closedAt', '>=', new Date(balYear, 0, 1).toISOString())
            .where('closedAt', '<', new Date(balYear + 1, 0, 1).toISOString()).get();
          const m = {};
          snap.forEach(d => {
            const o = d.data();
            if (o.paymentStatus !== 'Pago') return;
            const key = localDate(new Date(o.closedAt)).slice(0, 7), g = splitOrder(o);
            const r = m[key] || (m[key] = { pasteis: 0, caldosBebidas: 0, total: 0, pedidos: 0 });
            r.pasteis += g.pasteis; r.caldosBebidas += g.caldosBebidas; r.total += o.total || 0; r.pedidos += 1;
          });
          const batch = db.batch();
          for (let i = 1; i <= 12; i++) {
            const key = `${balYear}-${String(i).padStart(2, '0')}`;
            batch.set(db.collection('resumos').doc(key), m[key] || { pasteis: 0, caldosBebidas: 0, total: 0, pedidos: 0 });
          }
          await batch.commit();
          notify('Balanço recalculado.');
          setBalNonce(n => n + 1);
        } catch (e) { notify('Falha ao recalcular: ' + e.message, 'err'); setBalLoading(false); }
      };

      const cancelledToday = orders
        .filter(o => o.paymentStatus === 'Cancelado' && localDate(new Date(o.cancelledAt || o.createdAt)) === localDate())
        .sort((a, b) => String(a.cancelledAt || '').localeCompare(String(b.cancelledAt || '')));
      const cancelledTotal = cancelledToday.reduce((a, o) => a + (o.total || 0), 0);

      const visibleOrders = orders.filter(o => {
        const today = localDate();
        if (o.paymentStatus === 'Cancelado') return localDate(new Date(o.cancelledAt || o.createdAt)) === today;
        return o.paymentStatus !== 'Pago' || orderPaidDate(o) === today;
      });

      const cashReport = useMemo(() => {
        const todayStr = localDate();
        const todayOrders = orders.filter(o => o.paymentStatus === 'Pago' && orderPaidDate(o) === todayStr);

        let totalRevenue = 0;
        let pastelCount = 0;
        let pastelRevenue = 0;
        let beverageCount = 0;
        let beverageRevenue = 0;
        let payments = { PIX: 0, Dinheiro: 0, Cartão: 0 };

        todayOrders.forEach(o => {
          totalRevenue += o.total || 0;
          if (o.paymentMethod && payments[o.paymentMethod] !== undefined) {
            payments[o.paymentMethod] += o.total || 0;
          }

          if (o.items) {
            o.items.forEach(item => {
              const cat = item.category || '';
              const isPastel = cat.includes('Pastéis');
              const isBeverage = cat.includes('Caldo') || cat.includes('Bebidas');

              if (isPastel) {
                pastelCount += item.quantity || 0;
                pastelRevenue += (item.price || 0) * (item.quantity || 0);
              } else if (isBeverage) {
                beverageCount += item.quantity || 0;
                beverageRevenue += (item.price || 0) * (item.quantity || 0);
              }
            });
          }
        });

        return { todayStr, todayOrders, totalOrders: todayOrders.length, totalRevenue, pastelCount, pastelRevenue, beverageCount, beverageRevenue, payments };
      }, [orders]);

      const role = normRole(currentUser && currentUser.role);
      const isDev = role === 'DEV';
      const isGestor = role === 'DEV' || role === 'ADMIN';
      const canSeeCash = isGestor; // imprimir relatório de fechamento
      const navCls = (t) => `w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === t ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`;

      // Balanço mensal: lê os 12 resumos do ano (só gestores)
      useEffect(() => {
        if (activeTab !== 'balanco' || !isGestor || !db) return;
        let off = false;
        setBalLoading(true);
        Promise.all(Array.from({ length: 12 }, (_, i) =>
          db.collection('resumos').doc(`${balYear}-${String(i + 1).padStart(2, '0')}`).get()))
          .then(snaps => { if (!off) setBalData(snaps.map(x => x.exists ? x.data() : {})); })
          .catch(() => notify('Não foi possível carregar o balanço.', 'err'))
          .finally(() => { if (!off) setBalLoading(false); });
        return () => { off = true; };
      }, [activeTab, balYear, balNonce, isGestor]);

      // Reconecta sozinha à impressora já autorizada (Chrome/Edge recentes)
      useEffect(() => {
        if (!currentUser || !navigator.bluetooth || !navigator.bluetooth.getDevices) return;
        (async () => {
          try {
            const id = localStorage.getItem('imperio_printer');
            const d = (await navigator.bluetooth.getDevices()).find(x => x.id === id);
            if (d) { await btAttach(d, setPrinterOn); setPrinterName(d.name || 'Impressora'); setPrinterOn(true); }
          } catch (e) {}
        })();
      }, [!!currentUser]);

      if (!authReady) {
        return <div className="min-h-screen bg-imperio-green flex items-center justify-center text-yellow-400 font-black">Carregando...</div>;
      }

      if (!currentUser) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }

      return (
        <>
        <div id="app-shell" className="min-h-screen flex flex-col md:flex-row pb-safe-nav md:pb-0 bg-slate-100">
          
          <header className="glass-header sticky top-0 z-30 text-white px-4 py-3 shadow-md flex items-center justify-between md:hidden">
            <div className="flex items-center space-x-3">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Império Da Cana Logo" onError={hideImg}
                className="w-10 h-10 rounded-xl object-cover border-2 border-yellow-400 shadow-md bg-white"
              />
              <div>
                <h1 className="font-extrabold text-yellow-400 text-sm tracking-wide leading-tight">IMPÉRIO DA CANA</h1>
                <Status cloud={isDbConnected} printer={printerOn} />
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-xs bg-emerald-900/80 px-2.5 py-1 rounded-full font-bold text-yellow-300 border border-emerald-700 uppercase">
                {userLabel(currentUser)}
              </span>
              <button onClick={handleLogout} aria-label="Sair" className="p-2 bg-red-600/80 hover:bg-red-600 rounded-xl text-white transition">
                <Icon name="log-out" className="w-4 h-4" />
              </button>
            </div>
          </header>

          <aside className="hidden md:flex w-64 h-screen sticky top-0 bg-imperio-green text-white flex-col justify-between shadow-xl flex-shrink-0">
            <div className="p-4 border-b border-emerald-800/80 flex items-center space-x-3">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Logo" onError={hideImg}
                className="w-12 h-12 rounded-xl object-cover border-2 border-yellow-400 bg-white"
              />
              <div>
                <h2 className="font-black text-yellow-400 text-sm">IMPÉRIO DA CANA</h2>
                <span className="text-[10px] text-emerald-200">Desde 2015</span>
              </div>
            </div>

            <nav className="p-4 space-y-2 flex-1">
              {( <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'dashboard' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                  <Icon name="layout-dashboard" className="w-5 h-5" />
                  <span>Caixa Diário</span>
                </button>
              )}

              <button onClick={() => setActiveTab('pdv')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'pdv' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                <Icon name="shopping-bag" className="w-5 h-5" />
                <span>Novo Pedido</span>
              </button>

              <button onClick={() => setActiveTab('comandas')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'comandas' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                <Icon name="receipt" className="w-5 h-5" />
                <span>Comandas & Receber</span>
              </button>

              <button onClick={() => setActiveTab('kds')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${activeTab === 'kds' ? 'bg-yellow-400 text-green-950 shadow-lg' : 'hover:bg-emerald-800 text-emerald-100'}`}>
                <Icon name="utensils" className="w-5 h-5" />
                <span>Cozinha</span>
              </button>
              {isGestor && (
                <button onClick={() => setActiveTab('balanco')} className={navCls('balanco')}>
                  <Icon name="trending-up" className="w-5 h-5" />
                  <span>Balanço Mensal</span>
                </button>
              )}
              <button onClick={() => setActiveTab('impressao')} className={navCls('impressao')}>
                <Icon name="printer" className="w-5 h-5" />
                <span>Impressão</span>
              </button>
            </nav>
          <div className="p-4 border-t border-emerald-800/80 space-y-3">
              <Status cloud={isDbConnected} printer={printerOn} />
              <div className="text-xs font-bold text-yellow-300 uppercase truncate">{userLabel(currentUser)}</div>
              <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 py-2.5 bg-red-600/80 hover:bg-red-600 rounded-xl text-white text-xs font-bold transition">
                <Icon name="log-out" className="w-4 h-4" /> Sair
              </button>
            </div>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 sm:p-6 fade-in">

            {activeTab === 'dashboard' && (
              <div className="space-y-5">
                <div className="bg-gradient-to-br from-emerald-900 via-imperio-green to-emerald-950 text-white p-6 rounded-3xl shadow-xl border border-emerald-700/50">
                  <div className="flex justify-between items-center pb-4 border-b border-emerald-700/60">
                    <div>
                      <span className="text-[10px] font-black uppercase tracking-wider bg-yellow-400 text-emerald-950 px-3 py-1 rounded-full">
                        Fechamento de Hoje ({new Date().toLocaleDateString('pt-BR')})
                      </span>
                      <h2 className="text-2xl font-black text-white mt-2">Balanço de Vendas</h2>
                    </div>
                    {canSeeCash && <button onClick={handlePrintCashReport} className="p-3 bg-yellow-400 text-emerald-950 rounded-2xl font-extrabold text-xs shadow-lg hover:bg-yellow-300 transition flex items-center gap-1.5">
                      <Icon name="printer" className="w-4 h-4" /> Imprimir Relatório </button>}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
                    <div className="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-700/40">
                      <span className="text-xs text-emerald-300 font-semibold block">Total Geral</span>
                      <p className="text-2xl font-black text-yellow-400">R$ {cashReport.totalRevenue.toFixed(2)}</p>
                      <span className="text-[10px] text-emerald-200 mt-1 block">{cashReport.totalOrders} comandas liquidadas</span>
                    </div>

                    <div className="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-700/40">
                      <span className="text-xs text-emerald-300 font-semibold block">Pastéis Vendidos</span>
                      <p className="text-2xl font-black text-white">{cashReport.pastelCount} <span className="text-xs font-normal text-emerald-300">unid.</span></p>
                      <span className="text-xs font-bold text-yellow-400 block mt-1">R$ {cashReport.pastelRevenue.toFixed(2)}</span>
                    </div>

                    <div className="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-700/40">
                      <span className="text-xs text-emerald-300 font-semibold block">Bebidas & Caldo</span>
                      <p className="text-2xl font-black text-white">{cashReport.beverageCount} <span className="text-xs font-normal text-emerald-300">unid.</span></p>
                      <span className="text-xs font-bold text-yellow-400 block mt-1">R$ {cashReport.beverageRevenue.toFixed(2)}</span>
                    </div>
                  </div>

                  <div className="mt-5 pt-4 border-t border-emerald-700/60 grid grid-cols-3 gap-2 text-center">
                    <div className="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-800">
                      <span className="text-[10px] text-emerald-300 font-bold block">PIX</span>
                      <strong className="text-sm text-yellow-400 font-black">R$ {cashReport.payments.PIX.toFixed(2)}</strong>
                    </div>
                    <div className="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-800">
                      <span className="text-[10px] text-emerald-300 font-bold block">DINHEIRO</span>
                      <strong className="text-sm text-yellow-400 font-black">R$ {cashReport.payments.Dinheiro.toFixed(2)}</strong>
                    </div>
                    <div className="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-800">
                      <span className="text-[10px] text-emerald-300 font-bold block">CARTÃO</span>
                      <strong className="text-sm text-yellow-400 font-black">R$ {cashReport.payments.Cartão.toFixed(2)}</strong>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-3xl shadow-sm border border-red-200 p-5">
                  <div className="flex flex-wrap justify-between items-center gap-1 mb-2">
                    <h3 className="text-sm font-black text-red-700">Cancelamentos de hoje</h3>
                    <span className="text-xs font-bold text-slate-500">{cancelledToday.length} comanda(s) • R$ {cancelledTotal.toFixed(2)}</span>
                  </div>
                  {cancelledToday.length === 0 ? (
                    <p className="text-xs text-slate-500">Nenhum cancelamento hoje.</p>
                  ) : (
                    <ul className="divide-y divide-slate-100">
                      {cancelledToday.map(o => (
                        <li key={o.docId || o.id} className="py-2 text-xs">
                          <div className="flex justify-between font-bold text-slate-800">
                            <span>{o.id} • {o.customer}</span>
                            <span>R$ {(o.total || 0).toFixed(2)}</span>
                          </div>
                          <p className="text-slate-600">Motivo: {o.cancelReason || '-'}</p>
                          <p className="text-[10px] text-slate-400">por {o.cancelledBy || '-'}{o.wasPaid ? ' • já estava paga (valor estornado)' : ''}</p>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'balanco' && isGestor && (() => {
              const rows = (balData || Array(12).fill({})).map((r, i) => ({ m: MONTHS[i], p: r.pasteis || 0, c: r.caldosBebidas || 0, t: r.total || 0, n: r.pedidos || 0 }));
              const tot = rows.reduce((a, r) => ({ p: a.p + r.p, c: a.c + r.c, t: a.t + r.t, n: a.n + r.n }), { p: 0, c: 0, t: 0, n: 0 });
              const max = Math.max(1, ...rows.map(r => r.p + r.c));
              const brl = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
              const cy = new Date().getFullYear();
              return (
                <div className="space-y-5">
                  <div className="bg-gradient-to-br from-emerald-900 via-imperio-green to-emerald-950 text-white p-6 rounded-3xl shadow-xl border border-emerald-700/50">
                    <div className="flex flex-wrap justify-between items-center gap-3 pb-4 border-b border-emerald-700/60">
                      <div>
                        <span className="text-[10px] font-black uppercase tracking-wider bg-yellow-400 text-emerald-950 px-3 py-1 rounded-full">Entradas do ano</span>
                        <h2 className="text-2xl font-black mt-2">Balanço Mensal</h2>
                      </div>
                      <div className="flex items-center gap-2">
                        <label htmlFor="bal-year" className="text-xs font-bold text-emerald-200">Ano</label>
                        <select id="bal-year" value={balYear} onChange={e => setBalYear(Number(e.target.value))} className="px-3 py-2 rounded-xl bg-emerald-950 border border-emerald-700 text-yellow-300 text-sm font-bold">
                          {[cy - 2, cy - 1, cy].map(y => <option key={y} value={y}>{y}</option>)}
                        </select>
                        {isDev && <button onClick={recalcYear} className="px-3 py-2 rounded-xl bg-yellow-400 text-emerald-950 text-xs font-extrabold">Recalcular ano</button>}
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4">
                      <div className="bg-emerald-950/60 p-4 rounded-2xl"><span className="text-xs text-emerald-300 font-bold">Total do ano</span><p className="text-2xl font-black text-yellow-400">{brl(tot.t)}</p><span className="text-[10px] text-emerald-200">{tot.n} comandas liquidadas</span></div>
                      <div className="bg-emerald-950/60 p-4 rounded-2xl"><span className="text-xs text-emerald-300 font-bold">Pastéis</span><p className="text-2xl font-black text-white">{brl(tot.p)}</p></div>
                      <div className="bg-emerald-950/60 p-4 rounded-2xl"><span className="text-xs text-emerald-300 font-bold">Caldos + Bebidas</span><p className="text-2xl font-black text-white">{brl(tot.c)}</p></div>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-5">
                    {balLoading && <p className="text-xs font-bold text-slate-500 mb-2">Carregando...</p>}
                    <div className="flex items-end gap-1.5 sm:gap-3 h-52">
                      {rows.map(r => (
                        <div key={r.m} className="flex-1 h-full flex flex-col justify-end items-center" title={`${r.m}: ${brl(r.t)}`}>
                          <div className="w-full flex flex-col justify-end rounded-t-lg overflow-hidden" style={{ height: `${((r.p + r.c) / max) * 100}%` }}>
                            <div className="bg-yellow-400" style={{ flex: r.c }}></div>
                            <div className="bg-emerald-800" style={{ flex: r.p }}></div>
                          </div>
                          <span className="text-[10px] font-bold text-slate-500 mt-1">{r.m}</span>
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-4 mt-3 text-[11px] font-bold text-slate-600">
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-emerald-800"></span>Pastéis</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-yellow-400"></span>Caldos + Bebidas</span>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">

                {cancelTarget.paymentStatus === 'Pago' && <p className="text-xs font-bold text-amber-700 bg-amber-50 rounded-xl p-2.5">Esta comanda já foi paga: o valor será estornado do caixa e do balanço.</p>}
                <div>
                  <label htmlFor="cancel-reason" className="text-xs font-bold text-slate-700 block mb-1">Motivo do cancelamento (obrigatório)</label>
                  <textarea id="cancel-reason" rows={3} autoFocus value={cancelReason} onChange={e => setCancelReason(e.target.value)} placeholder="Ex.: cliente desistiu, pedido em duplicidade..."
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-red-400"></textarea>
                </div>
                <div className="flex gap-3">
                  <button onClick={() => { setCancelTarget(null); setCancelReason(''); }} className="flex-1 py-3 rounded-2xl bg-slate-200 text-slate-800 font-bold text-sm">Voltar</button>
                  <button onClick={confirmCancel} disabled={cancelBusy || cancelReason.trim().length < 3} className="flex-1 py-3 rounded-2xl bg-red-600 text-white font-black text-sm disabled:opacity-50">
                    {cancelBusy ? 'Cancelando...' : 'Confirmar'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {printPrompt && (
            <div className="print:hidden fixed inset-0 z-[70] bg-black/50 flex items-center justify-center p-4">
              <div role="dialog" aria-modal="true" className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
                <h3 className="text-lg font-black text-emerald-950">Comanda {printPrompt.id} {printPrompt._updated ? 'atualizada' : 'lançada'}!</h3>
                <p className="text-sm text-slate-600">Deseja imprimir a comanda?{!printerOn && ' (Impressora Bluetooth desconectada: abrirá a impressão do navegador.)'}</p>
                <div className="flex gap-3">
                  <button onClick={() => setPrintPrompt(null)} className="flex-1 py-3 rounded-2xl bg-slate-200 text-slate-800 font-bold text-sm">Não imprimir</button>
                  <button onClick={() => { const o = printPrompt; setPrintPrompt(null); printOrder(o); }} className="flex-1 py-3 rounded-2xl bg-imperio-green text-yellow-400 font-black text-sm flex items-center justify-center gap-2">
                    <Icon name="printer" className="w-4 h-4" /> Imprimir
                  </button>
                </div>
                <button onClick={() => { const o = printPrompt; setPrintPrompt(null); setCancelReason(''); setCancelTarget(o); }} className="w-full py-2.5 bg-red-50 text-red-700 font-bold rounded-2xl text-xs">
                  Cancelar pedido
                </button>
              </div>
            </div>
          )}

          {toast && (
            <div className={`print:hidden fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-3 rounded-2xl shadow-xl text-xs font-extrabold ${toast.type === 'err' ? 'bg-red-600 text-white' : 'bg-emerald-700 text-white'}`}>
              {toast.msg}
            </div>
          )}

          {/* ESTRUTURA 1: IMPRESSÃO DA COMANDA INDIVIDUAL (CUPOM) */}
          {printingOrder && (
            <div id="printable-ticket">
              <div style={{ textAlign: 'center', marginBottom: '10px' }}>
                <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: 0 }}>IMPÉRIO DA CANA</h2>
                <p style={{ fontSize: '10px', margin: 0 }}>PASTEL E CALDO DE CANA - DESDE 2015</p>
                <p style={{ fontSize: '10px', margin: 0 }}>Tel: (14) 99843-8050</p>
                <hr style={{ borderStyle: 'dashed', margin: '5px 0' }} />
              </div>

              <div>
                <p style={{ margin: '2px 0' }}><strong>COMANDA: {printingOrder.id}</strong></p>
                <p style={{ margin: '2px 0' }}>Cliente: {printingOrder.customer}</p>
                <p style={{ margin: '2px 0' }}>Local: {printingOrder.type}</p>
                <p style={{ margin: '2px 0' }}>Data: {new Date(printingOrder.createdAt).toLocaleString('pt-BR')}</p>
                <hr style={{ borderStyle: 'dashed', margin: '5px 0' }} />
              </div>

              <div style={{ marginBottom: '10px' }}>
                <p style={{ fontWeight: 'bold', margin: '3px 0' }}>ITENS:</p>
                {printingOrder.items && printingOrder.items.map((it, idx) => (
                  <div key={idx} style={{ marginBottom: '4px' }}>
                    <div>{it.quantity}x {it.nameWithFlavor || it.name} - R$ {(it.price * it.quantity).toFixed(2)}</div>
                  </div>
                ))}
              </div>

              <hr style={{ borderStyle: 'dashed', margin: '5px 0' }} />
              <div style={{ textAlign: 'right', fontWeight: 'bold', fontSize: '14px' }}>
                TOTAL: R$ {printingOrder.total ? printingOrder.total.toFixed(2) : '0.00'}
              </div>
            </div>
          )}

          {/* ESTRUTURA 2: IMPRESSÃO DO RELATÓRIO DO CAIXA DIÁRIO */}
          {canSeeCash && (
          <div id="printable-report">
            <div style={{ textAlign: 'center', marginBottom: '15px' }}>
              <h1 style={{ fontSize: '20px', fontWeight: 'bold', margin: 0 }}>IMPÉRIO DA CANA</h1>
              <h3 style={{ fontSize: '14px', margin: '5px 0' }}>RELATÓRIO DE FECHAMENTO DE CAIXA</h3>
              <p style={{ fontSize: '12px', color: '#555', margin: 0 }}>Data do Fechamento: {new Date().toLocaleDateString('pt-BR')}</p>
              <hr style={{ margin: '10px 0', borderColor: '#ccc' }} />
            </div>

            <div style={{ marginBottom: '15px' }}>
              <h4 style={{ margin: '5px 0', fontSize: '14px', borderBottom: '1px solid #000', paddingBottom: '3px' }}>RESUMO GERAL</h4>
              <p style={{ margin: '4px 0', fontSize: '12px' }}>Total de Comandas Liquidadas: <strong>{cashReport.totalOrders}</strong></p>
              <p style={{ margin: '4px 0', fontSize: '12px' }}>Pastéis Vendidos: <strong>{cashReport.pastelCount} unid.</strong> (R$ {cashReport.pastelRevenue.toFixed(2)})</p>
              <p style={{ margin: '4px 0', fontSize: '12px' }}>Bebidas / Caldo: <strong>{cashReport.beverageCount} unid.</strong> (R$ {cashReport.beverageRevenue.toFixed(2)})</p>
              <p style={{ margin: '6px 0', fontSize: '16px', fontWeight: 'bold' }}>FATURAMENTO TOTAL: R$ {cashReport.totalRevenue.toFixed(2)}</p>
            </div>

            <div style={{ marginBottom: '15px' }}>
              <h4 style={{ margin: '5px 0', fontSize: '14px', borderBottom: '1px solid #000', paddingBottom: '3px' }}>DETALHAMENTO POR FORMA DE PAGAMENTO</h4>
              <p style={{ margin: '4px 0', fontSize: '12px' }}>• PIX: <strong>R$ {cashReport.payments.PIX.toFixed(2)}</strong></p>
              <p style={{ margin: '4px 0', fontSize: '12px' }}>• DINHEIRO: <strong>R$ {cashReport.payments.Dinheiro.toFixed(2)}</strong></p>
              <p style={{ margin: '4px 0', fontSize: '12px' }}>• CARTÃO: <strong>R$ {cashReport.payments.Cartão.toFixed(2)}</strong></p>
            </div>

            <div>
              <h4 style={{ margin: '5px 0', fontSize: '14px', borderBottom: '1px solid #000', paddingBottom: '3px' }}>RELAÇÃO DE COMANDAS DO DIA</h4>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px', marginTop: '5px' }}>
                <thead>
                  <tr style={{ borderBottom: '1px solid #aaa', textAlign: 'left' }}>
                    <th style={{ padding: '4px' }}>Comanda</th>
                    <th style={{ padding: '4px' }}>Cliente</th>
                    <th style={{ padding: '4px' }}>Pagamento</th>
                    <th style={{ padding: '4px', textAlign: 'right' }}>Valor</th>
                  </tr>
                </thead>
                <tbody>
                  {cashReport.todayOrders && cashReport.todayOrders.map((o, idx) => (
                    <tr key={idx} style={{ borderBottom: '1px solid #eee' }}>
                      <td style={{ padding: '4px' }}>{o.id}</td>
                      <td style={{ padding: '4px' }}>{o.customer}</td>
                      <td style={{ padding: '4px' }}>{o.paymentMethod || 'Pendente'}</td>
                      <td style={{ padding: '4px', textAlign: 'right' }}>R$ {(o.total || 0).toFixed(2)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div style={{ marginTop: '15px' }}>
              <h4 style={{ margin: '5px 0', fontSize: '14px', borderBottom: '1px solid #000', paddingBottom: '3px' }}>CANCELAMENTOS DO DIA</h4>
              {cancelledToday.length === 0 ? (
                <p style={{ margin: '4px 0', fontSize: '12px' }}>Nenhum cancelamento.</p>
              ) : (
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px', marginTop: '5px' }}>
                  <thead>
                    <tr style={{ borderBottom: '1px solid #aaa', textAlign: 'left' }}>
                      <th style={{ padding: '4px' }}>Comanda</th>
                      <th style={{ padding: '4px' }}>Cliente</th>
                      <th style={{ padding: '4px' }}>Motivo / por</th>
                      <th style={{ padding: '4px', textAlign: 'right' }}>Valor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {cancelledToday.map((o, idx) => (
                      <tr key={idx} style={{ borderBottom: '1px solid #eee' }}>
                        <td style={{ padding: '4px' }}>{o.id}</td>
                        <td style={{ padding: '4px' }}>{o.customer}</td>
                        <td style={{ padding: '4px' }}>{o.cancelReason || '-'} ({o.cancelledBy || '-'}){o.wasPaid ? ' - estornada' : ''}</td>
                        <td style={{ padding: '4px', textAlign: 'right' }}>R$ {(o.total || 0).toFixed(2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
              <p style={{ margin: '6px 0', fontSize: '12px' }}>Total cancelado: <strong>R$ {cancelledTotal.toFixed(2)}</strong></p>
            </div>
          </div>
          )}
        </>
      );
    }

    function LoginScreen({ onLoginSuccess }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        if (!auth || !db) {
          setError('Sistema indisponível: não foi possível conectar ao Firebase.');
          setLoading(false);
          return;
        }

        try {
          const email = username.includes('@') ? username.trim() : `${username.trim()}@imperiodacana.com`;
          const cred = await auth.signInWithEmailAndPassword(email, password);
          const userDoc = await db.collection('usuarios').doc(cred.user.uid).get();

          if (!userDoc.exists) {
            setError('Perfil não encontrado no sistema.');
            await auth.signOut();
          } else if (!userDoc.data().ativo) {
            setError('Este usuário está inativo no sistema.');
            await auth.signOut();
          } else {
            onLoginSuccess(userDoc.data());
          }
        } catch (err) {
          console.error("Erro no login:", err.code);
          const bad = ['auth/user-not-found', 'auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-email'];
          if (bad.includes(err.code)) setError('Usuário ou senha incorretos.');
          else if (err.code === 'auth/too-many-requests') setError('Muitas tentativas. Aguarde e tente de novo.');
          else if (err.code === 'auth/network-request-failed') setError('Sem conexão com a internet.');
          else setError('Erro ao autenticar. Tente novamente.');
        }
        setLoading(false);
      };

      return (
        <div className="min-h-screen bg-imperio-green flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-sm w-full border-4 border-yellow-400 p-6 space-y-6 fade-in">
            <div className="text-center space-y-2">
              <img
                src={OFFICIAL_HERO_IMG}
                alt="Império Da Cana Logo"
                onError={hideImg}
                className="w-24 h-24 mx-auto rounded-2xl object-cover border-4 border-yellow-400 shadow-xl bg-white"
              />
              <h1 className="text-2xl font-black text-emerald-950 tracking-wide">IMPÉRIO DA CANA</h1>
              <p className="text-xs font-bold text-slate-500">Agudos, SP • Tel: (14) 99843-8050</p>
            </div>

            <form onSubmit={handleLoginSubmit} className="space-y-4">
              {error && (
                <div role="alert" className="p-3 bg-red-100 text-red-700 text-xs rounded-xl font-bold text-center">
                  {error}
                </div>
              )}

              <div>
                <label htmlFor="login-user" className="text-xs font-bold text-slate-700 block mb-1">Usuário</label>
                <input
                  id="login-user"
                  type="text"
                  autoComplete="username"
                  value={username}
                  onChange={e => setUsername(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-700"
                  required
                />
              </div>

              <div>
                <label htmlFor="login-pass" className="text-xs font-bold text-slate-700 block mb-1">Senha</label>
                <input
                  id="login-pass"
                  type="password"
                  autoComplete="current-password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-700"
                  required
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3.5 bg-imperio-green hover:bg-emerald-900 disabled:opacity-60 text-yellow-400 font-black rounded-2xl text-sm transition shadow-xl active:scale-[0.98] flex items-center justify-center gap-2"
              >
                {loading ? 'Autenticando...' : 'Entrar no Sistema'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
